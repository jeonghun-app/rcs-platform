      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      # Missing data is a breach: with every task gone the target group may
      # report nothing at all.
      ComparisonOperator: LessThanThreshold
      Threshold: 1
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: breaching
      Metrics:
        - Id: healthy
          ReturnData: true
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB

    Condition: WithIcscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-IcscfTransactionsRejected'
      AlarmDescription: 'icscf refused requests at its server-transaction cap. See docs/runbook.md#icscftransactionsrejected.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: ServerTransactionsRejected
      Dimensions: [{ Name: Service, Value: icscf }]
      Statistic: Sum
      Period: 60
  ScscfTransactionsRejected:
    Type: AWS::CloudWatch::Alarm
    Condition: WithScscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ScscfTransactionsRejected'
      AlarmDescription: 'scscf refused requests at its server-transaction cap. See docs/runbook.md#scscftransactionsrejected.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: ServerTransactionsRejected
      Dimensions: [{ Name: Service, Value: scscf }]
      Statistic: Sum
      Period: 60
  # ServerTransactionBytes is a gauge of the memory live server transactions
  # hold (#170); above 80% of MaxServerTransactionBytes (256 MiB by default)
  # the cap is near.
  PcscfTransactionBytes:
    Type: AWS::CloudWatch::Alarm
    Condition: WithPcscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-PcscfTransactionBytes'
      AlarmDescription: 'pcscf server transactions hold over 80% of MaxServerTransactionBytes. See docs/runbook.md#pcscftransactionbytes.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 214748365
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: missing
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: ServerTransactionBytes
      Dimensions: [{ Name: Service, Value: pcscf }]
      Statistic: Maximum
      Period: 60
  IcscfTransactionBytes:
    Type: AWS::CloudWatch::Alarm
    Condition: WithIcscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-IcscfTransactionBytes'
      AlarmDescription: 'icscf server transactions hold over 80% of MaxServerTransactionBytes. See docs/runbook.md#icscftransactionbytes.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 214748365
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: missing
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: ServerTransactionBytes
      Dimensions: [{ Name: Service, Value: icscf }]
      Statistic: Maximum
      Period: 60
  ScscfTransactionBytes:
    Type: AWS::CloudWatch::Alarm
    Condition: WithScscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ScscfTransactionBytes'
      AlarmDescription: 'scscf server transactions hold over 80% of MaxServerTransactionBytes. See docs/runbook.md#scscftransactionbytes.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 214748365
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: missing
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: ServerTransactionBytes
      Dimensions: [{ Name: Service, Value: scscf }]
      Statistic: Maximum
      Period: 60
  # A registration's state that scscf could not reassert at the HSS: the two
  # disagree for that set until it re-registers or a sweep retries.
  ScscfReassertFailed:
    Type: AWS::CloudWatch::Alarm
    Condition: WithScscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ScscfReassertFailed'
      AlarmDescription: 'scscf could not reassert registrations at the HSS. See docs/runbook.md#scscfreassertfailed.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: registrar.reassert_failed
      Dimensions: [{ Name: Service, Value: scscf }]
      Statistic: Sum
      Period: 60
  # An operator profile whose iFC evaluation exceeds its work budget (#14).
  ScscfIfcBudgetExceeded:
    Type: AWS::CloudWatch::Alarm
    Condition: WithScscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ScscfIfcBudgetExceeded'
      AlarmDescription: 'An iFC profile is too expensive to evaluate within budget. See docs/runbook.md#scscfifcbudgetexceeded.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: ifc.budget_exceeded
      Dimensions: [{ Name: Service, Value: scscf }]
      Statistic: Sum
      Period: 300

  # ClientConnections is a gauge the relay writes every interval; use its
  # Maximum. No FILL: with every relay task gone the alarm must see missing
  # data, not a filled zero.
  RelayConnectionsNearLimit:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-RelayConnectionsNearLimit'
      AlarmDescription: 'A relay task holds over 80% of RELAY_MAX_CONNECTIONS. See docs/runbook.md#relayconnectionsnearlimit.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0.8
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: missing
      Metrics:
        - Id: conns
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Sub 'RCS/${AWS::StackName}'
              MetricName: ClientConnections
              Dimensions: [{ Name: Service, Value: msrp-relay }]
            Period: 300
            Stat: Maximum
        - Id: share
          Expression: !Sub 'conns / ${RelayMaxConnections}'
          Label: RelayConnectionsNearLimit
          ReturnData: true

  MsrpBindingsReadBudget:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-MsrpBindingsReadBudget'
      AlarmDescription: 'Reads on msrp-bindings exceed the budget: lookups of unknown sessions, each one strongly consistent read. See docs/runbook.md#msrpbindingsreadbudget.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: !Ref MsrpReadBudget
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      Metrics:
        - Id: rcu
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ConsumedReadCapacityUnits
              Dimensions: [{ Name: TableName, Value: !Ref MsrpBindingsTable }]
            Period: 300
            Stat: Sum
        - Id: perSecond
          Expression: 'FILL(rcu, 0) / 300'
          Label: MsrpBindingsReadBudget
          ReturnData: true
  # Security changes, from CloudTrail management events (a trail must record
  # them in this account and region): any security group or secret change is
  # reported, including those a deployment makes.
  # A service that cannot start tasks (image, secrets, start-up refused) or a
  # deployment the circuit breaker failed: hss has no load balancer, so no
  # target metric would show it down.
  ServiceImpaired:
    Type: AWS::Events::Rule
    Properties:
      Description: ECS services of the stack that cannot place, configure or start tasks, or failed a deployment, reported to the alarm topic.
      # The stack's services by their ARNs: Deployment State Change events
      # carry no clusterArn in their detail, but both kinds name the service
      # in resources.
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Service Action, ECS Deployment State Change]
        resources: [{ prefix: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/' }]
        detail:
          eventName:
            - SERVICE_TASK_START_IMPAIRED
            - SERVICE_TASK_PLACEMENT_FAILURE
            - SERVICE_TASK_CONFIGURATION_FAILURE
            - SERVICE_DEPLOYMENT_FAILED
      Targets: [{ Id: alarm-topic, Arn: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]

  # Key policy and key state changes (threat model T7). Also fires on every
  # deployment that changes a key policy.
  KmsKeyChanges:
    Type: AWS::Events::Rule
    Properties:
      Description: KMS key policy and key state changes, reported to the alarm topic.
      EventPattern:
        source: [aws.kms]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [kms.amazonaws.com]
          eventName: [PutKeyPolicy, ScheduleKeyDeletion, DisableKey, CreateGrant, RevokeGrant]
      Targets: [{ Id: alarm-topic, Arn: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]

  # Task definitions decide what runs with which role (T7). Deployments
  # register new ones, so every deployment reports here too.
  TaskDefinitionChanges:
    Type: AWS::Events::Rule
    Properties:
      Description: ECS task definition registrations and service updates, reported to the alarm topic.
      EventPattern:
        source: [aws.ecs]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [ecs.amazonaws.com]
          eventName: [RegisterTaskDefinition, DeregisterTaskDefinition, UpdateService, CreateService, DeleteService]
      Targets: [{ Id: alarm-topic, Arn: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]

  # IAM is global: CloudTrail delivers its events to EventBridge in
  # us-east-1 only, so this rule exists only in a us-east-1 stack; elsewhere
  # see docs/aws-deployment.md (Prerequisites).
  IamPolicyChanges:
    Type: AWS::Events::Rule
    Condition: InUsEast1
    Properties:
      Description: IAM policy and trust changes, reported to the alarm topic.
      EventPattern:
        source: [aws.iam]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [iam.amazonaws.com]
          eventName:
            - PutRolePolicy
            - AttachRolePolicy
            - DetachRolePolicy
            - DeleteRolePolicy
            - UpdateAssumeRolePolicy
            - PutUserPolicy
            - AttachUserPolicy
            - CreatePolicyVersion
      Targets: [{ Id: alarm-topic, Arn: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]

  # Cost alarms (handbook: 80% and 100% of a daily and a monthly budget).
  # No BudgetName: a change of subscribers replaces a budget, and a fixed
  # name would make the new one collide with the old.
  # Each has a section in docs/runbook.md. The budgets see the whole account:
  # filtering on a tag needs a cost allocation tag activated by hand, and a
  # budget that silently sees nothing is worse than one that sees too much.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasMonthlyBudget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: SNS, Address: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: SNS, Address: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]
  DailyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasDailyBudget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: DAILY
        BudgetLimit: { Amount: !Ref DailyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: SNS, Address: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: SNS, Address: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]

  SecurityGroupChanges:
    Type: AWS::Events::Rule
    Properties:
      Description: Security group changes, reported to the alarm topic.
      EventPattern:
        source: [aws.ec2]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [ec2.amazonaws.com]
          eventName:
            - AuthorizeSecurityGroupIngress
            - AuthorizeSecurityGroupEgress
            - RevokeSecurityGroupIngress
            - RevokeSecurityGroupEgress
            - ModifySecurityGroupRules
            - CreateSecurityGroup
            - DeleteSecurityGroup
      Targets: [{ Id: alarm-topic, Arn: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]

  SecretChanges:
    Type: AWS::Events::Rule
    Properties:
      Description: Secrets Manager changes, reported to the alarm topic.
      EventPattern:
        source: [aws.secretsmanager]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [secretsmanager.amazonaws.com]
          eventName:
            - PutSecretValue
            - UpdateSecret
            - UpdateSecretVersionStage
            - DeleteSecret
            - RestoreSecret
            - RotateSecret
            - PutResourcePolicy
            - DeleteResourcePolicy
      Targets: [{ Id: alarm-topic, Arn: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn] }]

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub '${AWS::StackName}-VpcId' }
  PrivateSubnets:
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub '${AWS::StackName}-PrivateSubnets' }
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub '${AWS::StackName}-ClusterName' }
  NamespaceId:
    Value: !Ref Namespace
    Export: { Name: !Sub '${AWS::StackName}-NamespaceId' }
  NlbPublicAddresses:
    Description: The NLB's fixed public addresses, comma-separated; pcscf's PCSCF_PUBLIC_ADDRS.
    Value: !Join
      - ','
      - - !If [NewNlbAddressA, !Ref NlbAddressA, !Ref NlbReusedAddressA]
        - !If [NewNlbAddressB, !Ref NlbAddressB, !Ref NlbReusedAddressB]
  NlbAllocationIds:
    Description: The NLB's Elastic IP allocations; pass them as NlbAllocationIdA/B to a new stack to keep the addresses.
    Value: !Join
      - ','
      - - !If [NewNlbAddressA, !GetAtt NlbAddressA.AllocationId, !Ref NlbAllocationIdA]
        - !If [NewNlbAddressB, !GetAtt NlbAddressB.AllocationId, !Ref NlbAllocationIdB]
  NlbDnsName:
    Description: >
      Where clients reach SIP and MSRP: point the operator's names at it, or
      use it as RELAY_PUBLIC_HOST and the pcscf address acs provisions.
    Value: !GetAtt Nlb.DNSName
  AlbDnsName:
    Description: Where clients reach acs and ft-server.
    Value: !GetAtt Alb.DNSName
  OperatorSecurityGroupId:
    Description: Attach to a task or internal load balancer that may call the hss provisioning API.
    Value: !Ref OperatorSecurityGroup
  FilesBucketName:
    Value: !Ref FilesBucket
  DashboardUrl:
    Description: The stack's CloudWatch dashboard.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}'
  AlarmTopic:
    Description: Subscribe the on-call address here (when the stack created the topic).
    Value: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]
  HssAdminTokenSecret:
    Description: Secret holding the operator token of the HSS provisioning API.
    Value: !Ref HssAdminToken
  AcsAdminTokenSecret:
    Description: Secret holding the acs admin token.
    Value: !Ref AcsAdminToken
  ImageTag:
    Description: The platform image this stack runs (by digest ImageDigest).
    Value: !Ref ImageTag
  AcsImageTag:
    Description: The acs release this stack runs (by digest AcsImageDigest).
    Value: !Ref AcsImageTag

  PreviousImageTag:
    Description: The platform image it ran before; deploy.sh offers it as the rollback.
    Value: !Ref PreviousImageTag
  TemplateRevision:
    Description: git describe of the commit the template was deployed from.
    Value: !Ref TemplateRevision

  EmfErrorsHss:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-EmfErrorsHss'
      AlarmDescription: 'CloudWatch could not extract metrics from hss log lines. See docs/runbook.md#emferrorshss.'

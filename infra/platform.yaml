  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: CreateAlarmTopic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'
      KmsMasterKeyId: !Ref AlarmKey

  # A topic policy replaces the default one, so it names every publisher:
  # CloudWatch (alarms), EventBridge (security and service events) and,
  # with the budgets, AWS Budgets (checked).
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateAlarmTopic
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [cloudwatch.amazonaws.com, events.amazonaws.com, budgets.amazonaws.com] }
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }

  FtAuthBackendError:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-FtAuthBackendError'
      AlarmDescription: 'The HSS credential lookup fails; uploads get 503. See docs/runbook.md#ftauthbackenderror.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: m0
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Sub 'RCS/${AWS::StackName}'
              MetricName: auth.backend_error
              Dimensions: [{ Name: Service, Value: ft-server }]
            Period: 300
            Stat: Sum
        - Id: total
          Expression: 'FILL(m0, 0)'
          Label: FtAuthBackendError
          ReturnData: true

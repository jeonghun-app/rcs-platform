              Namespace: !Sub 'RCS/${AWS::StackName}'
              MetricName: cx.sar
              Dimensions: [{ Name: Service, Value: hss }]
            Period: 60
            Stat: Maximum
        - Id: slowest
          Expression: 'MAX([mar, sar])'
          Label: HssCxLatency
          ReturnData: true

  AcsTarget5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-AcsTarget5xx'
      AlarmDescription: 'Over 5% of acs requests through the ALB answer 5xx. See docs/runbook.md#acstarget5xx.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      # A ratio, guarded by at least 20 requests in 5 minutes: a count would
      # miss a full outage at night and fire on 1% at peak.
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0.05
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:

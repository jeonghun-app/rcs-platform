              Dimensions:
                - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
                - { Name: TargetGroup, Value: !GetAtt AcsTargetGroup.TargetGroupFullName }
            Period: 300
            Stat: Sum
        - Id: share
          Expression: 'IF(FILL(requests, 0) > 20, FILL(errors, 0) / FILL(requests, 0), 0)'
          Label: AcsTarget5xx
          ReturnData: true
  AcsNoHealthyTargets:
    Type: AWS::CloudWatch::Alarm
    # A service scaled to 0 has no targets on purpose.
    Condition: AcsRuns
    Properties:
      AlarmName: !Sub '${AWS::StackName}-AcsNoHealthyTargets'
      AlarmDescription: 'acs has no healthy target: the service is down for clients. See docs/runbook.md#acsnohealthytargets.'

    Condition: WithPcscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-PcscfTransactionsRejected'
      AlarmDescription: 'pcscf refused requests at its server-transaction cap. See docs/runbook.md#pcscftransactionsrejected.'

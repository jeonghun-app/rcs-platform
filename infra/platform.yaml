          ReturnData: true
  # pcscf (#16) on internal/sip/transport (#35): the queued output of all
  # connections against MaxQueuedBytes (256 MiB), and the stalled
  # connections closed to stay within it. Created with the SIP listeners;
  # the metric names are the transport's Stats fields and are confirmed by
  # pcscf's pull request.
  PcscfQueueUse:
    Type: AWS::CloudWatch::Alarm
    Condition: WithPcscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-PcscfQueueUse'
      AlarmDescription: 'pcscf output queues hold over 75% of their budget: slow or stalled clients. See docs/runbook.md#pcscfqueueuse.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: QueuedBytes
      Dimensions: [{ Name: Service, Value: pcscf }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 201326592
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
  PcscfBudgetSheds:
    Type: AWS::CloudWatch::Alarm
    Condition: WithPcscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-PcscfBudgetSheds'
      AlarmDescription: 'pcscf closed stalled connections to keep its queues within budget. See docs/runbook.md#pcscfbudgetsheds.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: BudgetSheds
      Dimensions: [{ Name: Service, Value: pcscf }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  PcscfBudgetRefusals:
    Type: AWS::CloudWatch::Alarm
    Condition: WithPcscf
    Properties:
      AlarmName: !Sub '${AWS::StackName}-PcscfBudgetRefusals'
      AlarmDescription: 'pcscf refused sends because the transport-wide queue budget is full. See docs/runbook.md#pcscfbudgetrefusals.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]

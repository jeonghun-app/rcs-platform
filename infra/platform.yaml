  # Addresses over WafRateLimit: counted (WafRateAction count) or blocked.
  # Counted ones measure real per-address peaks before blocking; see the
  # runbook on when to switch.
  WafRateLimited:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-WafRateLimited'
      AlarmDescription: 'Client addresses exceed the WAF rate limit (counted or blocked). See docs/runbook.md#wafratelimited.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: counted
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/WAFV2
              MetricName: CountedRequests
              Dimensions:
                - { Name: WebACL, Value: !Sub '${AWS::StackName}-alb' }
                - { Name: Region, Value: !Ref AWS::Region }
                - { Name: Rule, Value: rate-per-address }
            Period: 300
            Stat: Sum
        - Id: blocked
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/WAFV2
              MetricName: BlockedRequests
              Dimensions:
                - { Name: WebACL, Value: !Sub '${AWS::StackName}-alb' }
                - { Name: Region, Value: !Ref AWS::Region }
                - { Name: Rule, Value: rate-per-address }
            Period: 300
            Stat: Sum
        - Id: total
          Expression: 'FILL(counted, 0) + FILL(blocked, 0)'
          Label: WafRateLimited
          ReturnData: true
  # docs/hss.md: MAR and SAR latency against HSS_CX_TIMEOUT (3 s). Above 2 s

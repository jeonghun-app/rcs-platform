      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: invalid
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Logs
              MetricName: EMFValidationErrors
              Dimensions: [{ Name: LogGroupName, Value: !Ref HssLogGroup }]
            Period: 300
            Stat: Sum
        - Id: unparsed
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Logs
              MetricName: EMFParsingErrors
              Dimensions: [{ Name: LogGroupName, Value: !Ref HssLogGroup }]
            Period: 300
            Stat: Sum

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  RCS platform on AWS (ADR 0003): VPC across two AZs, ECS Fargate cluster, Cloud
  Map namespace, one security group per service in the ADR 0007 matrix, a public
  NLB for SIP and MSRP, a public ALB with AWS WAF for acs and ft-server, the
  tables, bucket, key and secrets, and the task definitions, services and
  alarms of hss, ft-server, msrp-relay and acs; the CSCFs and rcs-as attach to
  their security groups later. Deployed by scripts/deploy.sh, never by hand.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Stage }
        Parameters: [Environment]
      - Label: { default: Network }
        Parameters: [VpcCidr, NatGateways, InterfaceEndpoints, ServiceNamespace, PublicIngressCidr]
      - Label: { default: Load balancers }
        Parameters:
          - AlbCertificateArn
          - NlbCertificateArn
          - FtHostName
          - FtDeregistrationDelay
          - PcscfEnabled
          - ScscfEnabled
          - IcscfEnabled
          - WafRateLimit
          - WafRateAction
          - NlbAllocationIdA
          - NlbAllocationIdB
          - NlbReusedAddressA
          - NlbReusedAddressB
      - Label: { default: Release }
        Parameters:
          - EcrStackName
          - ImageTag
          - ImageDigest
          - AcsImageTag
          - AcsImageDigest
          - S3PrefixListId
          - DynamoDbPrefixListId
          - TemplateRevision
          - PreviousImageTag
          - DeployPrincipalArn
      - Label: { default: Identity }
        Parameters: [ImsDomain, FtRealm, AcsHostName, RelayPublicHost]
      - Label: { default: Services }
        Parameters:
          - HssDesiredCount
          - HssTaskSize
          - HssKeyringBootstrap
          - FtServerDesiredCount
          - FtServerTaskSize
          - FtValidityDays
          - FileEncryption
          - RelayDesiredCount
          - RelayTaskSize
          - RelayMaxConnections
          - AcsDesiredCount
          - AcsTaskSize
          - AcsSmsProvider
          - AcsSmsOriginationIdentity
          - AcsDefaultRcsProfile
      - Label: { default: Capacity and alarms }
        Parameters:
          - SubscribersWarmReadUnits
          - SubscribersWarmWriteUnits
          - MsrpWarmReadUnits
          - MsrpWarmWriteUnits
          - MsrpReadBudget
          - AlarmTopicArn
          - MonthlyBudgetUsd
          - DailyBudgetUsd
      - Label: { default: Observability }
        Parameters: [ContainerInsights, LogRetentionDays]

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: >
      RCS_ENV of every service. staging and prod require both certificates
      (see Rules) and get VPC Flow Logs and deletion protection.

  VpcCidr:
    Type: String
    Default: 10.30.0.0/16
    # 10.0-255.0.0, 172.16-31.0.0 or 192.168.0.0, as a /16 (#112).
    AllowedPattern: '^(10\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.0\.0/16$'
    ConstraintDescription: must be a /16 of RFC 1918 space (10/8, 172.16/12 or 192.168/16)
    Description: >
      A /16 of RFC 1918 space, split into two public and two private /20
      subnets. Services dial internal hosts only at RFC 1918 and ULA
      addresses (ADR 0007 §5): on any other range, such as 100.64.0.0/16,
      every HSS lookup from ft-server would be refused.

  NatGateways:
    Type: String
    Default: per-az
    AllowedValues: [per-az, single, none]
    Description: >
      per-az keeps task egress up when one AZ fails; single saves one NAT
      gateway's hourly charge for dev and test stacks; none (only with the
      interface endpoints, when nothing leaves for the internet) saves both
      and their Elastic IPs. Whether staging and prod go to none is decided
      after the first verification deployment (docs/aws-deployment.md#cost).

  InterfaceEndpoints:
    Type: String
    Default: auto
    AllowedValues: [auto, 'true', 'false']
    Description: >
      Interface endpoints for the AWS APIs tasks call (logs, ECR, Secrets
      Manager, KMS, Cloud Map), so they work without the NAT gateways and
      ft-server can be held to its own few destinations. auto means true
      outside dev; false (dev only) sends them through NAT, and ft-server
      then also needs HTTPS to the internet.

  ServiceNamespace:
    Type: String
    Default: rcs.local
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    Description: >
      Cloud Map private DNS namespace (RCS_SERVICE_NAMESPACE); services find
      each other as <service>.<namespace>.

  PublicIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    Description: >
      Who may reach the NLB and ALB. Handsets come from anywhere, so the
      default is the internet; narrow it while a stack is not yet meant for
      real clients.

  AlbCertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate for the ALB's HTTPS listener (acs and ft-server). Empty
      is allowed in dev only: the ALB then serves plain HTTP.

  NlbCertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate for the NLB's SIP TLS (5061) and MSRP TLS (2856)
      listeners. Empty is allowed in dev only: the TLS listeners are omitted.

  FtHostName:
    Type: String
    Default: ''
    # Empty, or a lower-case DNS name: a typo fails here, not at the ALB rule
    # or the service's start.
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
    Description: >
      Host name of the FT HTTP content server (the host of ftHTTPCSURI). When
      set, ft-server's routes also match on it, so acs and ft-server can share
      the ALB under different names; empty routes on paths alone.

  FtDeregistrationDelay:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600
    Description: >
      Seconds a stopping ft-server task keeps receiving in-flight requests
      from the ALB: long enough for most uploads to finish in place
      (docs/ft-server.md, Operations notes).

  IcscfEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Creates what needs icscf to exist, for now its alarms.

  ScscfEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Creates what needs scscf to exist (#89): for now the alarm on failed
      HSS pushes, which until then fail for want of a peer every time.

  PcscfEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Creates the SIP listeners and target group once pcscf exists (#16).
      The pcscf security group and its rules exist either way.

  WafRateLimit:
    Type: Number
    Default: 10000
    MinValue: 100
    MaxValue: 2000000000
    Description: >
      Requests per client address per 5 minutes above which the ALB's WAF
      rule acts on that address. A deployment prerequisite of ft-server
      (docs/ft-server.md, Operations notes): its own limits are per task.
      Handsets reach the stack through carrier-grade NAT, thousands behind
      one address, so size it to the busiest such address, not to a device.

  NlbAllocationIdA:
    Type: String
    Default: ''
    AllowedPattern: '^(eipalloc-[0-9a-f]+)?$'
    Description: >
      Allocation id of an Elastic IP to give the NLB in public subnet A, such
      as one an earlier stack retained (docs/runbook.md#keeping-the-nlb-addresses);
      empty allocates a new one. Clients cache the NLB's address.
  NlbAllocationIdB:
    Type: String
    Default: ''
    AllowedPattern: '^(eipalloc-[0-9a-f]+)?$'
    Description: As NlbAllocationIdA, for public subnet B.
  # Set by deploy.sh from the allocations above: CloudFormation cannot read an
  # Elastic IP's address from its allocation id.
  NlbReusedAddressA:
    Type: String
    Default: ''
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^$'
    Description: The public address of NlbAllocationIdA (deploy.sh sets it).
  NlbReusedAddressB:
    Type: String
    Default: ''
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^$'
    Description: The public address of NlbAllocationIdB (deploy.sh sets it).

  WafRateAction:
    Type: String
    Default: count
    AllowedValues: [count, block]
    Description: >
      What the rate rule does above WafRateLimit. count only counts (and
      alarms), to measure real per-address peaks first; block refuses
      (docs/runbook.md#wafratelimited says when to switch).

  ContainerInsights:
    Type: String
    Default: enabled
    AllowedValues: [enabled, disabled]

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Retention of the VPC Flow Logs and, later, the service log groups.

  # ------------------------------------------------- images, service blocks

  EcrStackName:
    Type: String
    Default: rcs-platform-ecr
    Description: Stack of infra/ecr.yaml, whose repository exports the task definitions use.

  ImageTag:
    Type: String
    AllowedPattern: '^[0-9A-Za-z._-]{1,128}$'
    Description: >
      Tag of the platform image (git describe; immutable). No default:
      deploy.sh passes it on every deployment, so a rollback names it.

  ImageDigest:
    Type: String
    AllowedPattern: '^sha256:[0-9a-f]{64}$'
    Description: >
      Digest of ImageTag in ECR, which the task definitions run, so a task
      always starts from the bytes deploy.sh checked (deploy.sh sets it).

  AcsImageTag:
    Type: String
    AllowedPattern: '^[0-9A-Za-z._-]{1,128}$'
    Description: Tag of the acs image, the pinned acs release (ADR 0006).

  AcsImageDigest:
    Type: String
    AllowedPattern: '^sha256:[0-9a-f]{64}$'
    Description: Digest of the acs image in ECR (deploy.sh sets it to the pinned ACS_DIGEST).

  # Set by deploy.sh: CloudFormation cannot look up the regional prefix
  # lists of the gateway endpoints.
  S3PrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: Managed prefix list com.amazonaws.<region>.s3 (deploy.sh looks it up).
  DynamoDbPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: Managed prefix list com.amazonaws.<region>.dynamodb (deploy.sh looks it up).

  # Recorded by deploy.sh in the outputs, for rollback and audit; they change
  # no resource.
  TemplateRevision:
    Type: String
    Default: unknown
    Description: git describe of the commit the template was deployed from.
  DeployPrincipalArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:(iam|sts)::[0-9]{12}:[A-Za-z0-9+=,.@_/-]+$'
    Description: >
      The IAM role or user deploying the stack (deploy.sh sets it from the
      caller's identity); the S-CSCF key lets it create and restore the
      tables, and nothing else.

  PreviousImageTag:
    Type: String
    Default: none
    Description: The platform image tag the stack ran before this deployment's ImageTag.

  ImsDomain:
    Type: String
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    Description: >
      Home network domain (RCS_IMS_DOMAIN), e.g. ims.mnc001.mcc001.3gppnetwork.org.
      Also the IMS Digest realm.

  FtRealm:
    Type: String
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    Description: >
      Digest realm of the FT credentials (FT_REALM, HSS_FT_REALM). Must
      differ from ImsDomain (ADR 0007 §8), so an FT credential can never
      register in IMS.

  FtValidityDays:
    Type: String
    Default: '7'
    AllowedValues: ['1', '2', '3', '5', '7', '10', '14', '30']
    Description: >
      FT_VALIDITY in days. The files bucket's lifecycle expiry (2 x validity
      + 1 day) and multipart abort are derived from it here, so the two cannot
      drift apart (docs/ft-server.md, Storage).

  FileEncryption:
    Type: String
    Default: AES256
    AllowedValues: [AES256, 'aws:kms']
    Description: >
      FT_SSE: SSE-S3, or SSE-KMS with the account's aws/s3 key. Both encrypt
      every object; SSE-KMS adds per-request KMS calls and charges.

  HssDesiredCount:
    Type: Number
    Default: 2
    MinValue: 0
    # A rolling update runs one task more, and a Cloud Map DNS answer lists
    # at most 8 addresses: a ninth hss task would get no Cx connection from
    # a CSCF that finds the HSS by DNS (ADR 0005).
    MaxValue: 7
  FtServerDesiredCount:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 10
  RelayDesiredCount:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 10
  AcsDesiredCount:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 10

  HssTaskSize:
    Type: String
    Default: 512x1024
    AllowedValues: [256x512, 512x1024, 1024x2048, 2048x4096]
    Description: CPU units x memory MiB of an hss task.
  HssKeyringBootstrap:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >
      HSS_KEYRING_BOOTSTRAP. true only for the one deployment after the
      keyring item is known to be lost for good; deploy again with false
      (docs/runbook.md#keyring-bootstrap).
  FtServerTaskSize:
    Type: String
    Default: 512x1024
    AllowedValues: [512x1024, 1024x2048, 2048x4096]
    Description: >
      CPU units x memory MiB of an ft-server task. 1024 MiB holds
      FT_MAX_CONCURRENT_UPLOADS 32 at 8 MiB parts (docs/ft-server.md, Memory).
  RelayTaskSize:
    Type: String
    Default: 512x1024
    AllowedValues: [256x512, 512x1024, 1024x2048, 2048x4096]
    Description: CPU units x memory MiB of an msrp-relay task.
  AcsTaskSize:
    Type: String
    Default: 512x1024
    AllowedValues: [256x512, 512x1024, 1024x2048]
    Description: CPU units x memory MiB of an acs task.

  RelayPublicHost:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
    Description: >
      RELAY_PUBLIC_HOST, the host of every client_path: an operator FQDN that
      names the NLB, or empty for the NLB's own DNS name.

  RelayMaxConnections:
    Type: Number
    Default: 5000
    MinValue: 100
    MaxValue: 100000
    Description: >
      RELAY_MAX_CONNECTIONS per task; size it to the task, not to the worst
      case (docs/msrp-relay.md, Limits and robustness).

  SubscribersWarmReadUnits:
    Type: Number
    Default: 12000
    MinValue: 12000
    Description: >
      Warm read throughput of the subscribers table (units per second), for
      the re-registration burst after an outage (docs/runbook.md, Re-registration
      burst sizing). Raising it is charged once and cannot be undone: never
      lower it in the config, or the deployment fails.
  SubscribersWarmWriteUnits:
    Type: Number
    Default: 4000
    MinValue: 4000
    Description: Warm write throughput of the subscribers table (units per second). It can be raised, never lowered.

  MsrpWarmReadUnits:
    Type: Number
    Default: 12000
    MinValue: 12000
    Description: >
      Warm read throughput of msrp-bindings (units per second), so the burst
      of re-INVITEs after relay tasks stop is not throttled (#54). It can be
      raised, never lowered.
  MsrpWarmWriteUnits:
    Type: Number
    Default: 4000
    MinValue: 4000
    Description: Warm write throughput of msrp-bindings (units per second). It can be raised, never lowered.
  MsrpReadBudget:
    Type: Number
    Default: 1000
    MinValue: 1
    Description: >
      Average read units per second on msrp-bindings above which an alarm
      fires: lookups of unknown sessions cost one strongly consistent read each.

  AcsHostName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
    Description: >
      Host name of acs on the ALB (the operator's configuration server name),
      used in the URIs acs hands out. Required outside dev: clients check the
      ALB certificate against it. Empty in dev uses the ALB's DNS name.

  AcsSmsProvider:
    Type: String
    Default: eum
    AllowedValues: [eum, sns, mock]
    Description: >
      ACS_SMS_PROVIDER. mock (dev only) sends nothing. The operator SMSC
      (smpp) is not wired in this template yet: it needs an egress rule to
      the SMSC.
  AcsSmsOriginationIdentity:
    Type: String
    Default: ''
    Description: ACS_SMS_ORIGINATION_IDENTITY for End User Messaging.
  AcsDefaultRcsProfile:
    Type: String
    Default: UP_2.4
    AllowedValues: [UP_2.4, UP_1.0, joyn_blackbird]

  AlarmTopicArn:
    Type: String
    Default: ''
    Description: >
      SNS topic for alarm and security notifications; empty creates one, to
      which you subscribe the on-call address after deployment.

  MonthlyBudgetUsd:
    Type: Number
    Default: 800
    MinValue: 0
    Description: >
      Cost budget of the account per month, in USD; notifications at 80% and
      100% go to the alarm topic. 0 creates no budget. It covers the whole
      account: one stack per account (docs/aws-deployment.md#cost), and if
      several share one anyway, only one of them sets a budget.
  DailyBudgetUsd:
    Type: Number
    Default: 35
    MinValue: 0
    Description: Cost budget of the account per day, in USD, notified like the monthly one. 0 creates none.

Mappings:
  # CloudFormation has no arithmetic, so values derived from a parameter are
  # tabulated: the lifecycle of the files bucket from FT_VALIDITY, and the
  # rolling-update ceiling from a desired count.
  FtValidity:
    '1': { Duration: 24h, LifecycleDays: 3, AbortDays: 2 }
    '2': { Duration: 48h, LifecycleDays: 5, AbortDays: 3 }
    '3': { Duration: 72h, LifecycleDays: 7, AbortDays: 4 }
    '5': { Duration: 120h, LifecycleDays: 11, AbortDays: 6 }
    '7': { Duration: 168h, LifecycleDays: 15, AbortDays: 8 }
    '10': { Duration: 240h, LifecycleDays: 21, AbortDays: 11 }
    '14': { Duration: 336h, LifecycleDays: 29, AbortDays: 15 }
    '30': { Duration: 720h, LifecycleDays: 61, AbortDays: 31 }

  # ADR 0003: maximumPercent 100 + 100/N rounded up, so a rolling update adds
  # one task and retires one per step and never cuts every connection at once.
  RollingUpdate:
    '0': { MaximumPercent: 200 }
    '1': { MaximumPercent: 200 }
    '2': { MaximumPercent: 150 }
    '3': { MaximumPercent: 134 }
    '4': { MaximumPercent: 125 }
    '5': { MaximumPercent: 120 }
    '6': { MaximumPercent: 117 }
    '7': { MaximumPercent: 115 }
    '8': { MaximumPercent: 113 }
    '9': { MaximumPercent: 112 }
    '10': { MaximumPercent: 110 }

  # CPU units, memory and GOMEMLIMIT (85% of the task memory, so the Go
  # collector works harder before ECS stops the task for memory) per size.
  TaskSize:
    256x512: { Cpu: '256', Memory: '512', GoMemLimit: 435MiB }
    512x1024: { Cpu: '512', Memory: '1024', GoMemLimit: 870MiB }
    1024x2048: { Cpu: '1024', Memory: '2048', GoMemLimit: 1740MiB }
    2048x4096: { Cpu: '2048', Memory: '4096', GoMemLimit: 3480MiB }

Rules:
  NoNatNeedsEndpoints:
    RuleCondition: !Equals [!Ref NatGateways, none]
    Assertions:
      - Assert: !Or
          - !Equals [!Ref InterfaceEndpoints, 'true']
          - !And [!Equals [!Ref InterfaceEndpoints, auto], !Not [!Equals [!Ref Environment, dev]]]
        AssertDescription: >
          NatGateways none needs the interface endpoints: without NAT, they
          are the only way to ECR, CloudWatch Logs and Secrets Manager.

  EndpointsOutsideDev:
    RuleCondition: !Not [!Equals [!Ref Environment, dev]]
    Assertions:
      - Assert: !Not [!Equals [!Ref InterfaceEndpoints, 'false']]
        AssertDescription: >
          staging and prod need the interface endpoints: without them
          ft-server needs HTTPS to the internet (#105).

  # An allocation and its address come together (deploy.sh sets the address
  # from the allocation), so NlbPublicAddresses, and pcscf's
  # PCSCF_PUBLIC_ADDRS with it, never gets an empty entry.
  NlbAddressPairA:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref NlbAllocationIdA, ''], !Equals [!Ref NlbReusedAddressA, '']]
          - !And [!Not [!Equals [!Ref NlbAllocationIdA, '']], !Not [!Equals [!Ref NlbReusedAddressA, '']]]
        AssertDescription: NlbAllocationIdA and NlbReusedAddressA are given together or not at all.
  NlbAddressPairB:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref NlbAllocationIdB, ''], !Equals [!Ref NlbReusedAddressB, '']]
          - !And [!Not [!Equals [!Ref NlbAllocationIdB, '']], !Not [!Equals [!Ref NlbReusedAddressB, '']]]
        AssertDescription: NlbAllocationIdB and NlbReusedAddressB are given together or not at all.
  # Two subnets, two addresses: one allocation cannot serve both.
  NlbAllocationsDistinct:
    RuleCondition: !Not [!Equals [!Ref NlbAllocationIdA, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref NlbAllocationIdA, !Ref NlbAllocationIdB]]
        AssertDescription: NlbAllocationIdA and NlbAllocationIdB must differ.

  ProductionNeedsTls:
    RuleCondition: !Not [!Equals [!Ref Environment, dev]]
    Assertions:
      - Assert: !Not [!Equals [!Ref AlbCertificateArn, '']]
        AssertDescription: >
          staging and prod need AlbCertificateArn: acs configuration and file
          transfer carry credentials and identities.
      - Assert: !Not [!Equals [!Ref NlbCertificateArn, '']]
        AssertDescription: >
          staging and prod need NlbCertificateArn: clients use SIP and MSRP over
          TLS, and msrp-relay refuses to offer plain MSRP.

  ProductionRunsTwoTasks:
    RuleCondition: !Equals [!Ref Environment, prod]
    Assertions:
      - Assert: !And
          - !Not [!Contains [['0', '1'], !Ref HssDesiredCount]]
          - !Not [!Contains [['0', '1'], !Ref FtServerDesiredCount]]
          - !Not [!Contains [['0', '1'], !Ref RelayDesiredCount]]
          - !Not [!Contains [['0', '1'], !Ref AcsDesiredCount]]
        AssertDescription: prod runs at least two tasks of every service, across two AZs (architecture §7).
  SeparateRealms:
    Assertions:
      - Assert: !Not [!Equals [!Ref FtRealm, !Ref ImsDomain]]
        AssertDescription: FtRealm must differ from ImsDomain (ADR 0007 §8).
  ClientFacingNames:
    RuleCondition: !Not [!Equals [!Ref Environment, dev]]
    Assertions:
      - Assert: !Not [!Equals [!Ref FtHostName, '']]
        AssertDescription: >
          staging and prod need FtHostName: the FT URIs must name the host the
          ALB certificate is for, not the ALB's own DNS name.
      - Assert: !Not [!Equals [!Ref AcsHostName, '']]
        AssertDescription: staging and prod need AcsHostName, for the same reason.
      - Assert: !Not [!Equals [!Ref RelayPublicHost, '']]
        AssertDescription: >
          staging and prod need RelayPublicHost: clients check the NLB
          certificate against the host of every client_path.
  NoMockSmsOutsideDev:
    RuleCondition: !Not [!Equals [!Ref Environment, dev]]
    Assertions:
      - Assert: !Not [!Equals [!Ref AcsSmsProvider, mock]]
        AssertDescription: the mock SMS provider sends nothing; dev only.

Conditions:
  IsDev: !Equals [!Ref Environment, dev]
  IsProduction: !Not [!Condition IsDev]
  NatPerAz: !Equals [!Ref NatGateways, per-az]
  HasNat: !Not [!Equals [!Ref NatGateways, none]]
  HasAlbCertificate: !Not [!Equals [!Ref AlbCertificateArn, '']]
  HasNlbCertificate: !Not [!Equals [!Ref NlbCertificateArn, '']]
  HasFtHostName: !Not [!Equals [!Ref FtHostName, '']]
  WithPcscf: !Equals [!Ref PcscfEnabled, 'true']
  WithScscf: !Equals [!Ref ScscfEnabled, 'true']
  WithIcscf: !Equals [!Ref IcscfEnabled, 'true']
  WithPcscfTls: !And [!Condition WithPcscf, !Condition HasNlbCertificate]
  # ADR 0003: plain SIP and MSRP are refused outside dev.
  WithPcscfPlain: !And [!Condition WithPcscf, !Condition IsDev]
  WafBlocks: !Equals [!Ref WafRateAction, block]
  NewNlbAddressA: !Equals [!Ref NlbAllocationIdA, '']
  NewNlbAddressB: !Equals [!Ref NlbAllocationIdB, '']

  CreateAlarmTopic: !Equals [!Ref AlarmTopicArn, '']
  WithInterfaceEndpoints: !Or
    - !Equals [!Ref InterfaceEndpoints, 'true']
    - !And [!Equals [!Ref InterfaceEndpoints, auto], !Condition IsProduction]
  NoInterfaceEndpoints: !Not [!Condition WithInterfaceEndpoints]
  WithEumEndpoint: !And [!Condition WithInterfaceEndpoints, !Condition UseAcsEum]
  WithSnsEndpoint: !And [!Condition WithInterfaceEndpoints, !Condition UseAcsSns]
  HasMonthlyBudget: !Not [!Equals [!Ref MonthlyBudgetUsd, '0']]
  HasDailyBudget: !Not [!Equals [!Ref DailyBudgetUsd, '0']]
  HasRelayPublicHost: !Not [!Equals [!Ref RelayPublicHost, '']]
  HasAcsHostName: !Not [!Equals [!Ref AcsHostName, '']]
  AcsRuns: !Not [!Equals [!Ref AcsDesiredCount, '0']]
  FtServerRuns: !Not [!Equals [!Ref FtServerDesiredCount, '0']]
  RelayRuns: !Not [!Equals [!Ref RelayDesiredCount, '0']]
  UseAcsEum: !Equals [!Ref AcsSmsProvider, eum]
  UseAcsSns: !Equals [!Ref AcsSmsProvider, sns]
  InUsEast1: !Equals [!Ref AWS::Region, us-east-1]

Resources:
  # ---------------------------------------------------------------- network

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets hold only the load balancers and NAT gateways; tasks never
  # get a public address.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-public-a' }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-public-b' }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-private-a' }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-private-b' }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-public' }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatAddressA:
    Condition: HasNat
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGatewayA:
    Condition: HasNat
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatAddressA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-nat-a' }

  NatAddressB:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      AllocationId: !GetAtt NatAddressB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-nat-b' }

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-private-a' }

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-private-b' }

  PrivateDefaultRouteA:
    Condition: HasNat
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  # With a single NAT gateway both AZs leave through AZ a.
  PrivateDefaultRouteB:
    Condition: HasNat
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [NatPerAz, !Ref NatGatewayB, !Ref NatGatewayA]

  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # Gateway endpoints cost nothing and keep DynamoDB and S3 traffic (every
  # service's state, ft-server's file content) off the NAT gateways.
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      RouteTableIds: [!Ref PrivateRouteTableA, !Ref PrivateRouteTableB]
      # Only resources of this account, so the route to the endpoint is not a
      # way out to another account's tables or buckets (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 'dynamodb:*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:ResourceAccount': !Ref AWS::AccountId }

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: [!Ref PrivateRouteTableA, !Ref PrivateRouteTableB]
      # Only resources of this account, so the route to the endpoint is not a
      # way out to another account's tables or buckets (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:ResourceAccount': !Ref AWS::AccountId }
          # ECR keeps image layers in a bucket of its own (ECR User Guide,
          # Amazon S3 gateway endpoint): image pulls need it.
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::prod-${AWS::Region}-starport-layer-bucket/*'

  # Interface endpoints (InterfaceEndpoints): the APIs tasks call, kept off
  # the NAT gateways, so they keep working when NAT or an AZ's egress fails
  # (data-servicediscovery is how the CSCFs find the HSS, #89), and so
  # ft-server's egress can be held to the HSS, S3, DynamoDB and these (#105).
  # Private DNS sends every task's calls here, so every task group may reach
  # them.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WithInterfaceEndpoints
    Properties:
      GroupDescription: Interface endpoints - HTTPS from the platform tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32, Description: 'no default egress' }
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-endpoints' }]

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  KmsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  ServiceDiscoveryEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.servicediscovery'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  DataServiceDiscoveryEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.data-servicediscovery'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  # acs's SMS provider, so that acs too needs no internet egress: End User
  # Messaging SMS (pinpoint-sms-voice-v2) or SNS, whichever it uses.
  SmsVoiceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithEumEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.pinpoint-sms-voice-v2'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  SnsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WithSnsEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sns'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      # Only principals of this account may use the endpoint (checked).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  # The public subnets' network ACL: allow everything at rule 1000, and keep
  # rules 1-999 free for the deny entries docs/runbook.md#blocking-a-source
  # adds by hand. Security groups cannot deny, and AWS WAF cannot sit on an
  # NLB, so this is the one place to turn a source away from SIP and MSRP.
  PublicNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public' }]
  PublicAclInbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNetworkAcl, RuleNumber: 1000, Protocol: -1, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0 }
  PublicAclOutbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNetworkAcl, RuleNumber: 1000, Protocol: -1, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0 }
  PublicSubnetAAcl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, NetworkAclId: !Ref PublicNetworkAcl }
  PublicSubnetBAcl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, NetworkAclId: !Ref PublicNetworkAcl }

  # ADR 0007 §9: VPC Flow Logs in production, so that an investigation can
  # see which task talked to what.
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProduction
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/rcs/${AWS::StackName}/vpc-flow-logs'
      RetentionInDays: !Ref LogRetentionDays

  FlowLogRole:
    Type: AWS::IAM::Role
    Condition: IsProduction
    Properties:
      Description: Lets VPC Flow Logs write to the stack's flow log group.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: write-flow-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn

  FlowLog:
    Type: AWS::EC2::FlowLog
    Condition: IsProduction
    Properties:
      ResourceType: VPC
      ResourceId: !Ref Vpc
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  # -------------------------------------------------------- compute, naming

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      # On-demand by default: SIP and MSRP tasks hold client connections, and a
      # Spot interruption drops them. A service may opt into FARGATE_SPOT.
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: FARGATE, Weight: 1 }
      ClusterSettings:
        - { Name: containerInsights, Value: !Ref ContainerInsights }

  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref ServiceNamespace
      Vpc: !Ref Vpc
      Description: Service discovery inside the platform VPC (ADR 0003, ADR 0005).

  # ------------------------------------------------------- security groups
  #
  # One group per service, exactly the matrix of ADR 0007 §2, which
  # scripts/check_infra.py checks: private groups admit only other groups,
  # never an address range, and only on the ports listed there. Every rule
  # between two groups is its own resource (no circular references), and every
  # group declares an egress rule inline, which removes the default allow-all
  # egress. Groups of services that do not exist yet are created now, so their
  # service blocks only attach them.
  #
  # Ports (the service blocks bind these):
  #   pcscf      5061 client SIP (NLB, TLS ended there), 5070 core SIP
  #   icscf      5060 SIP          scscf    5060 SIP
  #   rcs-as     5060 SIP, 2855 MSRP
  #   hss        3868 Diameter Cx, 8081 provisioning API
  #   msrp-relay 2855 MSRP (NLB), 8082 control API
  #   ft-server  8081 HTTP (ALB), 8080 admin (ALB health check)
  #   acs        8080 HTTP (ALB)
  # Admin ports of services without a load balancer get no ingress: the ECS
  # container health check runs inside the task (-healthcheck).

  PcscfSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: pcscf - client SIP from the NLB, core SIP from scscf
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # With interface endpoints (staging, prod) the AWS APIs are reached
        # only through them and the gateway endpoints; HTTPS to the internet
        # through NAT is the dev-only fallback without them.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs (ECR, logs, secrets) through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-pcscf' }]

  IcscfSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: icscf - SIP from pcscf, rcs-as and scscf
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # With interface endpoints (staging, prod) the AWS APIs are reached
        # only through them and the gateway endpoints; HTTPS to the internet
        # through NAT is the dev-only fallback without them.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs (ECR, logs, secrets) through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-icscf' }]

  ScscfSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: scscf - SIP from pcscf, rcs-as and icscf
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # With interface endpoints (staging, prod) the AWS APIs are reached
        # only through them and the gateway endpoints; HTTPS to the internet
        # through NAT is the dev-only fallback without them.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs (ECR, logs, secrets) through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-scscf' }]

  RcsAsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: rcs-as - SIP from scscf and icscf, MSRP from msrp-relay
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # With interface endpoints (staging, prod) the AWS APIs are reached
        # only through them and the gateway endpoints; HTTPS to the internet
        # through NAT is the dev-only fallback without them.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs (ECR, logs, secrets) through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-rcs-as' }]

  HssSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: hss - Cx from icscf and scscf, API from ft-server, acs and operators
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # With interface endpoints (staging, prod) the AWS APIs are reached
        # only through them and the gateway endpoints; HTTPS to the internet
        # through NAT is the dev-only fallback without them.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs (ECR, logs, secrets, KMS) through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-hss' }]

  MsrpRelaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: msrp-relay - MSRP from the NLB, control API from pcscf
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # With interface endpoints (staging, prod) the AWS APIs are reached
        # only through them and the gateway endpoints; HTTPS to the internet
        # through NAT is the dev-only fallback without them.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs (ECR, logs, secrets, DynamoDB) through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-msrp-relay' }]

  FtServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ft-server - HTTP and health checks from the ALB
      VpcId: !Ref Vpc
      # Only the HSS API (FtServerToHssApiOut), S3 and DynamoDB through their
      # gateway endpoints, and the interface endpoints (FtServerToEndpointsOut):
      # a wrong FT_HSS_URL or a compromised task cannot send FT_HSS_TOKEN or
      # files anywhere else (#105, checked). Without interface endpoints
      # (dev only) the other AWS APIs go through NAT.
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-ft-server' }]

  AcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: acs - HTTP from the ALB
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # With interface endpoints (staging, prod) the AWS APIs are reached
        # only through them and the gateway endpoints; HTTPS to the internet
        # through NAT is the dev-only fallback without them.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs and SMS providers through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-acs' }]

  # The operator path to the HSS API (ADR 0007 §5): attach this group to a
  # one-off task or an internal load balancer; it is never on the public ALB.
  OperatorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: operator - may call the hss provisioning API
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # With interface endpoints (staging, prod) the AWS APIs are reached
        # only through them and the gateway endpoints; HTTPS to the internet
        # through NAT is the dev-only fallback without them.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId, Description: 'S3 (gateway endpoint)' }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId, Description: 'DynamoDB (gateway endpoint)' }
        - !If
          - NoInterfaceEndpoints
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs (ECR, logs, secrets) through NAT (dev without interface endpoints)' }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-operator' }]

  NlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NLB - SIP and MSRP from clients
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # The plain ports exist in dev only (ADR 0003), like their listeners.
        - !If
          - IsDev
          - { IpProtocol: tcp, FromPort: 5060, ToPort: 5060, CidrIp: !Ref PublicIngressCidr, Description: 'SIP over TCP (dev)' }
          - !Ref AWS::NoValue
        - { IpProtocol: tcp, FromPort: 5061, ToPort: 5061, CidrIp: !Ref PublicIngressCidr, Description: 'SIP over TLS' }
        - !If
          - IsDev
          - { IpProtocol: tcp, FromPort: 2855, ToPort: 2855, CidrIp: !Ref PublicIngressCidr, Description: 'MSRP over TCP (dev)' }
          - !Ref AWS::NoValue
        - { IpProtocol: tcp, FromPort: 2856, ToPort: 2856, CidrIp: !Ref PublicIngressCidr, Description: 'MSRP over TLS' }
      # Only the target rules below leave the NLB; this unroutable entry
      # replaces the default allow-all.
      SecurityGroupEgress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32, Description: 'no default egress' }
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-nlb' }]

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTP and HTTPS from clients
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref PublicIngressCidr, Description: 'HTTPS' }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref PublicIngressCidr, Description: 'HTTP (redirect, or dev)' }
      SecurityGroupEgress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32, Description: 'no default egress' }
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-alb' }]

  # Each matrix entry is an ingress rule on the destination and the matching
  # egress rule on the source.

  # pcscf's client listener is 5061 (PCSCF_CLIENT_ADDR, nlb-tls mode): the
  # NLB ends TLS and forwards there, from its TLS listener and, in dev, its
  # plain 5060 one. Only the NLB reaches it.
  NlbToPcscfSip:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PcscfSecurityGroup, SourceSecurityGroupId: !Ref NlbSecurityGroup, IpProtocol: tcp, FromPort: 5061, ToPort: 5061, Description: 'client SIP and health checks' }
  NlbToPcscfSipOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref NlbSecurityGroup, DestinationSecurityGroupId: !Ref PcscfSecurityGroup, IpProtocol: tcp, FromPort: 5061, ToPort: 5061, Description: 'client SIP and health checks' }

  NlbToRelayMsrp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref MsrpRelaySecurityGroup, SourceSecurityGroupId: !Ref NlbSecurityGroup, IpProtocol: tcp, FromPort: 2855, ToPort: 2855, Description: 'client MSRP and health checks' }
  NlbToRelayMsrpOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref NlbSecurityGroup, DestinationSecurityGroupId: !Ref MsrpRelaySecurityGroup, IpProtocol: tcp, FromPort: 2855, ToPort: 2855, Description: 'client MSRP and health checks' }

  AlbToAcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref AcsSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, Description: 'acs HTTP and health checks' }
  AlbToAcsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AlbSecurityGroup, DestinationSecurityGroupId: !Ref AcsSecurityGroup, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, Description: 'acs HTTP and health checks' }

  AlbToFtServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref FtServerSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 8081, ToPort: 8081, Description: 'file transfer' }
  AlbToFtServerOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AlbSecurityGroup, DestinationSecurityGroupId: !Ref FtServerSecurityGroup, IpProtocol: tcp, FromPort: 8081, ToPort: 8081, Description: 'file transfer' }

  AlbToFtServerAdmin:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref FtServerSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, Description: 'health checks on /readyz' }
  AlbToFtServerAdminOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AlbSecurityGroup, DestinationSecurityGroupId: !Ref FtServerSecurityGroup, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, Description: 'health checks on /readyz' }

  IcscfToHssCx:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref HssSecurityGroup, SourceSecurityGroupId: !Ref IcscfSecurityGroup, IpProtocol: tcp, FromPort: 3868, ToPort: 3868, Description: 'Diameter Cx' }
  IcscfToHssCxOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref IcscfSecurityGroup, DestinationSecurityGroupId: !Ref HssSecurityGroup, IpProtocol: tcp, FromPort: 3868, ToPort: 3868, Description: 'Diameter Cx' }

  ScscfToHssCx:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref HssSecurityGroup, SourceSecurityGroupId: !Ref ScscfSecurityGroup, IpProtocol: tcp, FromPort: 3868, ToPort: 3868, Description: 'Diameter Cx' }
  ScscfToHssCxOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ScscfSecurityGroup, DestinationSecurityGroupId: !Ref HssSecurityGroup, IpProtocol: tcp, FromPort: 3868, ToPort: 3868, Description: 'Diameter Cx' }

  FtServerToHssApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref HssSecurityGroup, SourceSecurityGroupId: !Ref FtServerSecurityGroup, IpProtocol: tcp, FromPort: 8081, ToPort: 8081, Description: 'FT credential lookups' }
  FtServerToHssApiOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref FtServerSecurityGroup, DestinationSecurityGroupId: !Ref HssSecurityGroup, IpProtocol: tcp, FromPort: 8081, ToPort: 8081, Description: 'FT credential lookups' }

  AcsToHssApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref HssSecurityGroup, SourceSecurityGroupId: !Ref AcsSecurityGroup, IpProtocol: tcp, FromPort: 8081, ToPort: 8081, Description: 'credential issue' }
  AcsToHssApiOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AcsSecurityGroup, DestinationSecurityGroupId: !Ref HssSecurityGroup, IpProtocol: tcp, FromPort: 8081, ToPort: 8081, Description: 'credential issue' }

  # Every task group to the interface endpoints (HTTPS).
  PcscfToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref PcscfSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  PcscfToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref PcscfSecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  IcscfToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref IcscfSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  IcscfToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref IcscfSecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  ScscfToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref ScscfSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  ScscfToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref ScscfSecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  RcsAsToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref RcsAsSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  RcsAsToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref RcsAsSecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  HssToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref HssSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  HssToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref HssSecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  MsrpRelayToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref MsrpRelaySecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  MsrpRelayToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref MsrpRelaySecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  FtServerToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref FtServerSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  FtServerToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref FtServerSecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  AcsToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref AcsSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  AcsToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref AcsSecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  OperatorToEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref EndpointSecurityGroup, SourceSecurityGroupId: !Ref OperatorSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }
  OperatorToEndpointsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: WithInterfaceEndpoints
    Properties: { GroupId: !Ref OperatorSecurityGroup, DestinationSecurityGroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, Description: 'AWS APIs' }

  OperatorToHssApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref HssSecurityGroup, SourceSecurityGroupId: !Ref OperatorSecurityGroup, IpProtocol: tcp, FromPort: 8081, ToPort: 8081, Description: 'provisioning' }
  OperatorToHssApiOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref OperatorSecurityGroup, DestinationSecurityGroupId: !Ref HssSecurityGroup, IpProtocol: tcp, FromPort: 8081, ToPort: 8081, Description: 'provisioning' }

  PcscfToIcscf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref IcscfSecurityGroup, SourceSecurityGroupId: !Ref PcscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }
  PcscfToIcscfOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref PcscfSecurityGroup, DestinationSecurityGroupId: !Ref IcscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }

  RcsAsToIcscf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref IcscfSecurityGroup, SourceSecurityGroupId: !Ref RcsAsSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }
  RcsAsToIcscfOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RcsAsSecurityGroup, DestinationSecurityGroupId: !Ref IcscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }

  ScscfToIcscf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref IcscfSecurityGroup, SourceSecurityGroupId: !Ref ScscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }
  ScscfToIcscfOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ScscfSecurityGroup, DestinationSecurityGroupId: !Ref IcscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }

  PcscfToScscf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ScscfSecurityGroup, SourceSecurityGroupId: !Ref PcscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }
  PcscfToScscfOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref PcscfSecurityGroup, DestinationSecurityGroupId: !Ref ScscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }

  RcsAsToScscf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ScscfSecurityGroup, SourceSecurityGroupId: !Ref RcsAsSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }
  RcsAsToScscfOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RcsAsSecurityGroup, DestinationSecurityGroupId: !Ref ScscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }

  IcscfToScscf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ScscfSecurityGroup, SourceSecurityGroupId: !Ref IcscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }
  IcscfToScscfOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref IcscfSecurityGroup, DestinationSecurityGroupId: !Ref ScscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }

  # ADR 0007 §2, §7: the core listener is a different port from the client
  # listener, and only scscf reaches it.
  ScscfToPcscfCore:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PcscfSecurityGroup, SourceSecurityGroupId: !Ref ScscfSecurityGroup, IpProtocol: tcp, FromPort: 5070, ToPort: 5070, Description: 'core SIP' }
  ScscfToPcscfCoreOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ScscfSecurityGroup, DestinationSecurityGroupId: !Ref PcscfSecurityGroup, IpProtocol: tcp, FromPort: 5070, ToPort: 5070, Description: 'core SIP' }

  ScscfToRcsAs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref RcsAsSecurityGroup, SourceSecurityGroupId: !Ref ScscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }
  ScscfToRcsAsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ScscfSecurityGroup, DestinationSecurityGroupId: !Ref RcsAsSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP' }

  # TS 24.229 §5.3.2.1: icscf routes directly to the conference factory and
  # other PSIs that rcs-as hosts.
  IcscfToRcsAs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref RcsAsSecurityGroup, SourceSecurityGroupId: !Ref IcscfSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP to PSIs' }
  IcscfToRcsAsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref IcscfSecurityGroup, DestinationSecurityGroupId: !Ref RcsAsSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP to PSIs' }

  # rcs-as tasks forward a group chat's requests to the task that owns the
  # group (#121): rcs-as reaches rcs-as on its internal SIP port.
  RcsAsToRcsAs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref RcsAsSecurityGroup, SourceSecurityGroupId: !Ref RcsAsSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP to the group owner' }
  RcsAsToRcsAsOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RcsAsSecurityGroup, DestinationSecurityGroupId: !Ref RcsAsSecurityGroup, IpProtocol: tcp, FromPort: 5060, ToPort: 5060, Description: 'SIP to the group owner' }

  # threat model T3: only the relay reaches rcs-as's MSRP port.
  RelayToRcsAsMsrp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref RcsAsSecurityGroup, SourceSecurityGroupId: !Ref MsrpRelaySecurityGroup, IpProtocol: tcp, FromPort: 2855, ToPort: 2855, Description: 'MSRP' }
  RelayToRcsAsMsrpOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref MsrpRelaySecurityGroup, DestinationSecurityGroupId: !Ref RcsAsSecurityGroup, IpProtocol: tcp, FromPort: 2855, ToPort: 2855, Description: 'MSRP' }

  PcscfToRelayControl:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref MsrpRelaySecurityGroup, SourceSecurityGroupId: !Ref PcscfSecurityGroup, IpProtocol: tcp, FromPort: 8082, ToPort: 8082, Description: 'relay control API' }
  PcscfToRelayControlOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref PcscfSecurityGroup, DestinationSecurityGroupId: !Ref MsrpRelaySecurityGroup, IpProtocol: tcp, FromPort: 8082, ToPort: 8082, Description: 'relay control API' }

  # -------------------------------------------------------------------- NLB
  #
  # Every target group has Proxy Protocol v2 on (ADR 0003): Fargate targets
  # are IP targets, for which the NLB does not keep the client address on TLS
  # listeners. Health checks are TCP connections to the traffic port: with
  # PPv2 on, AWS sends the PPv2 header on health check connections too (with
  # the LOCAL command), which the SIP and MSRP transports accept, whereas the
  # admin HTTP server would not parse it.

  Nlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internet-facing
      # Fixed addresses: clients put the NLB's address in their first Route
      # (TS 24.229, NOTE 15), so pcscf must know it (PCSCF_PUBLIC_ADDRS), and
      # it must not change under clients that cached it.
      SubnetMappings:
        - SubnetId: !Ref PublicSubnetA
          AllocationId: !If [NewNlbAddressA, !GetAtt NlbAddressA.AllocationId, !Ref NlbAllocationIdA]
        - SubnetId: !Ref PublicSubnetB
          AllocationId: !If [NewNlbAddressB, !GetAtt NlbAddressB.AllocationId, !Ref NlbAllocationIdB]
      SecurityGroups: [!Ref NlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: load_balancing.cross_zone.enabled, Value: 'true' }
        - { Key: deletion_protection.enabled, Value: !If [IsProduction, 'true', 'false'] }
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-nlb' }]

  # The NLB's public addresses, one per public subnet, allocated unless
  # NlbAllocationIdA/B name existing ones. Retained when the stack goes, so
  # a new stack can take them back through those parameters and clients'
  # cached addresses keep working. A change that replaces the NLB itself
  # cannot be applied with fixed addresses: the new NLB is created while the
  # old still holds them.
  NlbAddressA:
    Type: AWS::EC2::EIP
    Condition: NewNlbAddressA
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-nlb-a' }]
  NlbAddressB:
    Type: AWS::EC2::EIP
    Condition: NewNlbAddressB
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-nlb-b' }]

  PcscfSipTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: WithPcscf
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: TCP
      Port: 5061
      HealthCheckProtocol: TCP
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: proxy_protocol_v2.enabled, Value: 'true' }
        # Off, so targets see the NLB's group as the source and the matrix
        # holds; the client address arrives in the PPv2 header instead.
        - { Key: preserve_client_ip.enabled, Value: 'false' }
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
        # Stated, not left to the default: on, the NLB would reset every
        # client connection 30 s after deregistration, all at once, before
        # the service's own staggered drain (ADR 0003).
        - { Key: deregistration_delay.connection_termination.enabled, Value: 'false' }

  RelayMsrpTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: TCP
      Port: 2855
      HealthCheckProtocol: TCP
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: proxy_protocol_v2.enabled, Value: 'true' }
        # Off, so targets see the NLB's group as the source and the matrix
        # holds; the client address arrives in the PPv2 header instead.
        - { Key: preserve_client_ip.enabled, Value: 'false' }
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
        - { Key: deregistration_delay.connection_termination.enabled, Value: 'false' }

  # The idle timeout is configurable on TCP listeners only; TLS listeners keep
  # a fixed 350 s, which the keep-alives are sized for (ADR 0003). The plain
  # listeners exist in dev only: ADR 0003 refuses unencrypted SIP and MSRP in
  # staging and prod, and the target port cannot tell the two apart. In dev,
  # plain SIP on 5060 goes to the same target port 5061 as TLS: pcscf's
  # nlb-tls listener, which takes every flow as TLS-protected (sips Path).
  # That is a dev shortcut, not a supported mode (#16 decides whether dev
  # pcscf gets a tcp-mode listener of its own).
  SipTcpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: WithPcscfPlain
    Properties:
      LoadBalancerArn: !Ref Nlb
      Protocol: TCP
      Port: 5060
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref PcscfSipTargetGroup }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: '1800' }

  SipTlsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: WithPcscfTls
    Properties:
      LoadBalancerArn: !Ref Nlb
      Protocol: TLS
      Port: 5061
      Certificates: [{ CertificateArn: !Ref NlbCertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref PcscfSipTargetGroup }]

  MsrpTcpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsDev
    Properties:
      LoadBalancerArn: !Ref Nlb
      Protocol: TCP
      Port: 2855
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref RelayMsrpTargetGroup }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: '1800' }

  MsrpTlsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasNlbCertificate
    Properties:
      LoadBalancerArn: !Ref Nlb
      Protocol: TLS
      Port: 2856
      Certificates: [{ CertificateArn: !Ref NlbCertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref RelayMsrpTargetGroup }]

  # -------------------------------------------------------------------- ALB

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        # Longer than ft-server's 30 s FT_IDLE_TIMEOUT, so the service, not
        # the ALB, decides when a stalled transfer ends.
        - { Key: idle_timeout.timeout_seconds, Value: '60' }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: deletion_protection.enabled, Value: !If [IsProduction, 'true', 'false'] }
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-alb' }]

  AcsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  FtServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8081
      HealthCheckProtocol: HTTP
      HealthCheckPort: '8080'
      HealthCheckPath: /readyz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: !Ref FtDeregistrationDelay }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasAlbCertificate
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTPS
      Port: 443
      Certificates: [{ CertificateArn: !Ref AlbCertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{ Type: fixed-response, FixedResponseConfig: { StatusCode: '404', ContentType: text/plain } }]

  # One listener on port 80 whatever the certificate: with one it redirects
  # to HTTPS, without one (dev only, see Rules) it serves plain HTTP. Two
  # conditional listeners on the same port would collide when a certificate
  # is added to a running stack, since CloudFormation creates the new one
  # before it deletes the old.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - !If
          - HasAlbCertificate
          - Type: redirect
            RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
          - { Type: fixed-response, FixedResponseConfig: { StatusCode: '404', ContentType: text/plain } }

  # Only the client-facing paths reach a service; everything else, acs's
  # /admin API and console included, gets the listeners' fixed 404 (ADR 0007
  # §5: operator APIs are never on the public ALB). acs's admin is reached
  # from inside the VPC. ft-server answers on its upload (/ft) and download
  # (/dl) paths (FT_UPLOAD_URI, FT_DOWNLOAD_URI).
  FtServerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasAlbCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: [/ft, /ft/*, /dl] }
        - !If
          - HasFtHostName
          - Field: host-header
            HostHeaderConfig: { Values: [!Ref FtHostName] }
          - !Ref AWS::NoValue
      Actions: [{ Type: forward, TargetGroupArn: !Ref FtServerTargetGroup }]

  # acs's configuration paths (ACS_CONFIG_PATHS, RCC.14), OMA-DM, and the
  # MSISDN entry flow, as acs's pinned release serves them. A rule takes at
  # most five values, hence two.
  AcsConfigRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasAlbCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: [/, /config, /rcs/config] }
      Actions: [{ Type: forward, TargetGroupArn: !Ref AcsTargetGroup }]

  AcsDeviceRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasAlbCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 21
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: [/dm, /dm/mo, /msisdn, /msisdn/verify] }
      Actions: [{ Type: forward, TargetGroupArn: !Ref AcsTargetGroup }]

  # A rate-based rule per client address: ft-server's and acs's own limits are
  # per task, so only this limits one client across tasks.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-alb'
      Rules:
        - Name: rate-per-address
          Priority: 0
          Action: !If [WafBlocks, { Block: {} }, { Count: {} }]
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-per-address

  # WAF logs record every request the ALB receives, for audit. The query
  # string and the identity and credential headers are redacted: acs's
  # configuration queries carry IMSI and MSISDN, and ft-server's download ids
  # are capabilities. (ALB access logs are off for the same reason: they
  # cannot redact the query string.)
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # WAF requires the aws-waf-logs- prefix.
      LogGroupName: !Sub 'aws-waf-logs-${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs:
        - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WafLogGroup}'
      RedactedFields:
        - QueryString: {}
        - SingleHeader: { Name: authorization }
        - SingleHeader: { Name: cookie }
        - SingleHeader: { Name: x-3gpp-intended-identity }

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt WebAcl.Arn

  # ------------------------------------------------------------------ data
  #
  # Every table: on demand, point-in-time recovery (scripts/check_infra.py
  # checks it), encryption at rest, deletion protection and Retain outside dev
  # so that deleting the stack or a mistaken replacement never drops state.

  SubscribersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-subscribers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: profile, AttributeType: S }
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: profile-index
          KeySchema: [{ AttributeName: profile, KeyType: HASH }]
          Projection: { ProjectionType: KEYS_ONLY }
      WarmThroughput:
        ReadUnitsPerSecond: !Ref SubscribersWarmReadUnits
        WriteUnitsPerSecond: !Ref SubscribersWarmWriteUnits
      # The keyring item lives here: losing it loses every stored secret
      # (docs/hss.md, Secrets).
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true }
      Tags: [{ Key: Service, Value: hss }]

  ServiceProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-service-profiles'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true }
      Tags: [{ Key: Service, Value: hss }]

  FilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-files'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true }
      Tags: [{ Key: Service, Value: ft-server }]

  # core_path holds rcs-as session ids, which are capabilities (threat model
  # T3): only the relay's task role reads this table (checked), and nothing
  # exports it.
  MsrpBindingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-msrp-bindings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      WarmThroughput:
        ReadUnitsPerSecond: !Ref MsrpWarmReadUnits
        WriteUnitsPerSecond: !Ref MsrpWarmWriteUnits
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true }
      Tags: [{ Key: Service, Value: msrp-relay }]

  AcsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-acs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      # The layout of acs's own infra/app.yaml: OTP challenges and DM sessions
      # expire themselves.
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true }
      Tags: [{ Key: Service, Value: acs }]

  # The S-CSCF's shared state (#89, docs/scscf-state.md), created before
  # scscf runs so its pull request only adds the service. The items hold
  # Contact URIs, instance ids (IMEI URNs) and IMPIs that embed IMSIs, so
  # the document asks for: a customer-managed key, point-in-time recovery
  # for a stated 35 days, and the tables granted to scscf's task role only,
  # with no Scan for anyone (check_infra.py, SCAN_ALLOWED).
  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-registrations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: impi, AttributeType: S }
        - { AttributeName: shard, AttributeType: S }
        - { AttributeName: expires, AttributeType: N }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: impi-index
          KeySchema:
            - { AttributeName: impi, KeyType: HASH }
          Projection: { ProjectionType: KEYS_ONLY }
        - IndexName: expiry-index
          KeySchema:
            - { AttributeName: shard, KeyType: HASH }
            - { AttributeName: expires, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      # TTL on ttl, a backstop after the expiry the sweeps act on; expires is
      # the expiry index's sort key (#14).
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true, RecoveryPeriodInDays: 35 }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref ScscfStateKey }
      Tags: [{ Key: Service, Value: scscf }]

  AuthChallengesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-auth-challenges'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expires, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true, RecoveryPeriodInDays: 35 }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref ScscfStateKey }
      Tags: [{ Key: Service, Value: scscf }]

  RegSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-reg-subscriptions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: impu, AttributeType: S }
        - { AttributeName: shard, AttributeType: S }
        - { AttributeName: expires, AttributeType: N }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: impu-index
          KeySchema:
            - { AttributeName: impu, KeyType: HASH }
          Projection: { ProjectionType: KEYS_ONLY }
        - IndexName: expiry-index
          KeySchema:
            - { AttributeName: shard, KeyType: HASH }
            - { AttributeName: expires, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true, RecoveryPeriodInDays: 35 }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref ScscfStateKey }
      Tags: [{ Key: Service, Value: scscf }]

  # Encrypts the S-CSCF tables. The account administers it; only two
  # principals may use it, both only through DynamoDB: scscf's task role,
  # named here, and the principal deploying the stack (DeployPrincipalArn,
  # set by deploy.sh), which creates and restores the tables. A role that
  # gained read access to a table would still be refused its data.
  ScscfStateKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'Encrypts the S-CSCF state tables of ${AWS::StackName}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AdministerWithoutUsing
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:CreateAlias
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: ScscfReadsThroughDynamoDb
            Effect: Allow
            Principal: { AWS: !GetAtt ScscfTaskRole.Arn }
            Action: [kms:Encrypt, kms:Decrypt, 'kms:ReEncrypt*', 'kms:GenerateDataKey*', kms:DescribeKey]
            Resource: '*'
            Condition:
              StringLike: { 'kms:ViaService': 'dynamodb.*.amazonaws.com' }
          # Creating a table under a key needs the creator to hold these
          # (DynamoDB developer guide, Authorizing use of your KMS key).
          - Sid: DeployerCreatesTablesThroughDynamoDb
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: [kms:Encrypt, kms:Decrypt, 'kms:ReEncrypt*', 'kms:GenerateDataKey*', kms:DescribeKey, kms:CreateGrant]
            Resource: '*'
            Condition:
              StringEquals:
                'aws:PrincipalArn': !Ref DeployPrincipalArn
                'kms:CallerAccount': !Ref AWS::AccountId
              StringLike: { 'kms:ViaService': 'dynamodb.*.amazonaws.com' }
          - Sid: DynamoDbDescribesTheKey
            Effect: Allow
            Principal: { Service: dynamodb.amazonaws.com }
            Action: ['kms:Describe*', 'kms:Get*', 'kms:List*']
            Resource: '*'

  ScscfStateKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}/scscf-state'
      TargetKeyId: !Ref ScscfStateKey

  # rcs-as's store-and-forward queue and sent-message records (#69,
  # docs/rcs-as.md, DynamoDB messages table). Created before rcs-as runs so
  # its pull request only adds the service. Queue items hold message
  # content: only rcs-as's task role may read it (check_infra.py).
  # rcs-as's groups (#118, docs/rcs-as.md, DynamoDB groupchats table): one
  # item per group, the roster with participants' identities, so only
  # rcs-as reads it (check_infra.py). The rcs-as service block owns it.
  GroupChatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-groupchats'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true }
      Tags: [{ Key: Service, Value: rcs-as }]

  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-messages'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: xb, AttributeType: S }
        - { AttributeName: expires, AttributeType: N }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      # Sparse: only queue items carry xb, one of 16 buckets, so the sweep
      # queries the index bucket by bucket instead of scanning the table.
      GlobalSecondaryIndexes:
        - IndexName: expiry
          KeySchema:
            - { AttributeName: xb, KeyType: HASH }
            - { AttributeName: expires, KeyType: RANGE }
          Projection: { ProjectionType: INCLUDE, NonKeyAttributes: [owner, lease_until] }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      SSESpecification: { SSEEnabled: true }
      Tags: [{ Key: Service, Value: rcs-as }]

  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: !Ref FileEncryption }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          # Twice the validity plus a day: S3 dates a multipart object from
          # the start of its upload, which may complete up to one validity
          # later (docs/ft-server.md, S3). Downloads refuse expired files
          # whatever is still here.
          - Id: expire-files
            Status: Enabled
            ExpirationInDays: !FindInMap [FtValidity, !Ref FtValidityDays, LifecycleDays]
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: !FindInMap [FtValidity, !Ref FtValidityDays, AbortDays]
      Tags: [{ Key: Service, Value: ft-server }]

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt FilesBucket.Arn, !Sub '${FilesBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  # The HSS keyring key (docs/hss.md, Secrets). The account administers it,
  # but only the hss task role may use it, and only with the encryption
  # context the HSS sets, so no other principal can unwrap the data key.
  HssKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'Wraps the HSS data key of ${AWS::StackName}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AdministerWithoutUsing
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:CreateAlias
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: HssWrapsAndUnwraps
            Effect: Allow
            Principal: { AWS: !GetAtt HssTaskRole.Arn }
            Action: [kms:GenerateDataKey, kms:Decrypt]
            Resource: '*'
            Condition:
              StringEquals:
                'kms:EncryptionContext:service': hss
                'kms:EncryptionContext:purpose': subscriber-secrets

  HssKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}/hss-keyring'
      TargetKeyId: !Ref HssKey

  # --------------------------------------------------------------- secrets
  #
  # Every token of ADR 0007 §4, current and next, generated here: 64
  # characters from [A-Za-z0-9] carry about 380 bits. Each is readable only by
  # the execution roles of the services that hold it (scripts/check_infra.py
  # refuses a task role that could read one). Tokens rotate by moving the next
  # value into current (docs/runbook.md).

  HssAdminToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/hss/admin-token'
      Description: Operator token of the HSS provisioning API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  HssAdminTokenNext:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/hss/admin-token-next'
      Description: Next operator token of the HSS provisioning API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  AcsHssToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/hss/acs-token'
      Description: Token acs presents to the HSS provisioning API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  AcsHssTokenNext:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/hss/acs-token-next'
      Description: Next token acs presents to the HSS provisioning API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  FtHssToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/hss/ft-server-token'
      Description: Token ft-server presents to the HSS provisioning API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  FtHssTokenNext:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/hss/ft-server-token-next'
      Description: Next token ft-server presents to the HSS provisioning API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  PcscfRelayToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/msrp-relay/pcscf-token'
      Description: Token pcscf presents to the msrp-relay control API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  PcscfRelayTokenNext:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/msrp-relay/pcscf-token-next'
      Description: Next token pcscf presents to the msrp-relay control API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  # One key for every platform service, so that a subscriber's log hints
  # correlate across services (internal/pii).
  PiiHmacKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/rcs/pii-hmac-key'
      Description: RCS_PII_HMAC_KEY, keying the log hints of internal/pii.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  FtNonceKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/ft-server/nonce-key'
      Description: FT_NONCE_KEY, shared by every ft-server task.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  AcsAdminToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/acs/admin-token'
      Description: ACS_ADMIN_TOKEN of the acs admin API.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }
  AcsPiiHashSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/acs/pii-hash-secret'
      Description: ACS_PII_HASH_SECRET of acs's log hashing.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true, IncludeSpace: false }

  # ------------------------------------------------------------------ logs

  HssLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/rcs/${AWS::StackName}/hss', RetentionInDays: !Ref LogRetentionDays }
  FtServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/rcs/${AWS::StackName}/ft-server', RetentionInDays: !Ref LogRetentionDays }
  RelayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/rcs/${AWS::StackName}/msrp-relay', RetentionInDays: !Ref LogRetentionDays }
  AcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/rcs/${AWS::StackName}/acs', RetentionInDays: !Ref LogRetentionDays }

  # ------------------------------------------------------------------- IAM
  #
  # Execution roles pull the image, write the log group and read the
  # service's own secrets; task roles reach the service's own tables, bucket
  # and key, and no secret (ADR 0007 §4).

  HssExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Starts hss tasks - image, logs, hss's secrets.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: start
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: { 'Fn::ImportValue': !Sub '${EcrStackName}-PlatformRepositoryArn' }
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt HssLogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref PiiHmacKey
                  - !Ref HssAdminToken
                  - !Ref HssAdminTokenNext
                  - !Ref AcsHssToken
                  - !Ref AcsHssTokenNext
                  - !Ref FtHssToken
                  - !Ref FtHssTokenNext

  HssTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: hss tasks - the subscriber and profile tables. The keyring key's policy grants its use.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: tables
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt SubscribersTable.Arn
                  - !GetAtt ServiceProfilesTable.Arn
              # Scan with Limit 1 at every start tells an empty table from a
              # lost keyring (docs/hss.md, Secrets); a task without it exits.
              # Scoped to the keys-only index, never the table.
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:Scan]
                Resource: !Sub '${SubscribersTable.Arn}/index/profile-index'

  FtServerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Starts ft-server tasks - image, logs, ft-server's secrets.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: start
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: { 'Fn::ImportValue': !Sub '${EcrStackName}-PlatformRepositoryArn' }
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt FtServerLogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref PiiHmacKey, !Ref FtHssToken, !Ref FtNonceKey]

  FtServerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: ft-server tasks - the files bucket and table (docs/ft-server.md, IAM).
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: files
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:AbortMultipartUpload]
                Resource: !Sub '${FilesBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FilesBucket.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Scan, dynamodb:DescribeTable]
                Resource: !GetAtt FilesTable.Arn

  RelayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Starts msrp-relay tasks - image, logs, the relay's secrets.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: start
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: { 'Fn::ImportValue': !Sub '${EcrStackName}-PlatformRepositoryArn' }
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt RelayLogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref PiiHmacKey, !Ref PcscfRelayToken, !Ref PcscfRelayTokenNext]

  # The only reader of msrp-bindings (#54, threat model T3).
  MsrpRelayTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: msrp-relay tasks - the bindings table, nothing else.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: bindings
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:DescribeTable]
                Resource: !GetAtt MsrpBindingsTable.Arn

  # scscf tasks, ready for the service block of #89: item actions on the
  # three tables, queries on their indexes, no Scan, and the tables' key
  # only through DynamoDB.
  ScscfTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: scscf tasks - the S-CSCF state tables (ScscfStatePolicy) and HSS discovery.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: discovery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The HSS's Cx peers come from Cloud Map, every one of them
              # (ADR 0005; a DNS answer stops at 8). The action has no
              # resource, so the condition holds it to the hss service.
              - Effect: Allow
                Action: servicediscovery:DiscoverInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    'servicediscovery:NamespaceName': !Ref ServiceNamespace
                    'servicediscovery:ServiceName': hss

  # A policy of its own, not inline: the tables' key names ScscfTaskRole, and
  # the tables need the key, so a role that named the tables would close a
  # dependency cycle. The key's policy grants the role its use; nothing here
  # needs to.
  ScscfStatePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref ScscfTaskRole
      PolicyName: state
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only reg-subscriptions is updated in place (NOTIFY counters);
          # registrations and challenges are put and deleted whole.
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:DescribeTable]
            Resource:
              - !GetAtt RegistrationsTable.Arn
              - !GetAtt AuthChallengesTable.Arn
              - !GetAtt RegSubscriptionsTable.Arn
          - Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: !GetAtt RegSubscriptionsTable.Arn
          - Effect: Allow
            Action: dynamodb:Query
            Resource:
              - !Sub '${RegistrationsTable.Arn}/index/impi-index'
              - !Sub '${RegistrationsTable.Arn}/index/expiry-index'
              - !Sub '${RegSubscriptionsTable.Arn}/index/impu-index'
              - !Sub '${RegSubscriptionsTable.Arn}/index/expiry-index'

  # icscf tasks, ready for their service block: they find the HSS like scscf.
  IcscfTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: icscf tasks - finding the HSS's Cx peers in Cloud Map.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: discovery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: servicediscovery:DiscoverInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    'servicediscovery:NamespaceName': !Ref ServiceNamespace
                    'servicediscovery:ServiceName': hss

  # rcs-as tasks, ready for the service block of #69: the actions
  # docs/rcs-as.md lists. A transaction has no IAM action of its own; each
  # write inside one needs the action of its kind (Put, Update, Delete), and
  # rcs-as uses no ConditionCheck items.
  RcsAsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: rcs-as tasks - the messages and groupchats tables.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: messages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  # Group receipt summaries check a condition inside a
                  # transaction (#182).
                  - dynamodb:ConditionCheckItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource: !GetAtt MessagesTable.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub '${MessagesTable.Arn}/index/expiry'
              # Groups: each change a conditional rewrite of the group's item;
              # ConditionCheckItem for the owner-epoch checks of #121.
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem, dynamodb:DescribeTable]
                Resource: !GetAtt GroupChatsTable.Arn

  AcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Starts acs tasks - image, logs, acs's secrets.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: start
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: { 'Fn::ImportValue': !Sub '${EcrStackName}-AcsRepositoryArn' }
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt AcsLogGroup.Arn
              # AcsHssToken is added here when acs calls the HSS (ADR 0006: an
              # acs release); until then acs holds no HSS token.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AcsAdminToken, !Ref AcsPiiHashSecret]

  AcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: acs tasks - acs's table and, for OTP, sending SMS.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:DescribeTable]
                Resource: !GetAtt AcsTable.Arn
              # The index is only queried.
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub '${AcsTable.Arn}/index/gsi1'
        # Only the chosen provider's send action. Sending an SMS to a number
        # has no resource to scope to, so Resource is '*' as the APIs require;
        # for SNS a Deny keeps it to phone numbers, never a topic. Whether
        # End User Messaging's SendTextMessage can be held to the origination
        # identity's ARN is open (the Service Authorization Reference was not
        # reachable from the review host); verify before narrowing, since a
        # wrong resource would stop every OTP.
        - !If
          - UseAcsEum
          - PolicyName: sms
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: sms-voice:SendTextMessage
                  Resource: '*'
          - !Ref AWS::NoValue
        - !If
          - UseAcsSns
          - PolicyName: sms
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: sns:Publish
                  Resource: '*'
                - Effect: Deny
                  Action: sns:Publish
                  Resource: !Sub 'arn:${AWS::Partition}:sns:*:*:*'
          - !Ref AWS::NoValue

  # ---------------------------------------------------- service discovery

  HssDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: hss
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }], RoutingPolicy: MULTIVALUE }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  FtServerDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: ft-server
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }], RoutingPolicy: MULTIVALUE }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  RelayDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: msrp-relay
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }], RoutingPolicy: MULTIVALUE }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  AcsDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: acs
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }], RoutingPolicy: MULTIVALUE }
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  # ------------------------------------------------------ task definitions
  #
  # Every container: read-only root file system, all capabilities dropped,
  # not privileged (scripts/check_infra.py), the image's non-root user, a
  # health check through -healthcheck (distroless has no shell or curl), and
  # 120 s to stop, the most Fargate allows, which the services' shutdown
  # settings use.

  HssTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-hss'
      Cpu: !FindInMap [TaskSize, !Ref HssTaskSize, Cpu]
      Memory: !FindInMap [TaskSize, !Ref HssTaskSize, Memory]
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt HssExecutionRole.Arn
      TaskRoleArn: !GetAtt HssTaskRole.Arn
      ContainerDefinitions:
        - Name: hss
          Image: !Sub
            - '${Repository}@${ImageDigest}'
            - Repository: { 'Fn::ImportValue': !Sub '${EcrStackName}-PlatformRepositoryUri' }
          Command: [hss]
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          StopTimeout: 120
          PortMappings:
            - { ContainerPort: 3868, Protocol: tcp }
            - { ContainerPort: 8081, Protocol: tcp }
          # hss gives up on its store and keyring after HSS_START_TIMEOUT and
          # exits, which the circuit breaker sees. The health check must not
          # stop the task first: StartPeriod + Interval x Retries stays above
          # the start timeout, and the timeout at most 240 s, since ECS allows
          # a StartPeriod of 300 s at most (checked by check_infra.py).
          HealthCheck: { Command: [CMD, hss, -healthcheck], Interval: 15, Timeout: 5, Retries: 3, StartPeriod: 60 }
          Environment:
            - { Name: RCS_ENV, Value: !Ref Environment }
            - { Name: RCS_IMS_DOMAIN, Value: !Ref ImsDomain }
            - { Name: RCS_SERVICE_NAMESPACE, Value: !Ref ServiceNamespace }
            - { Name: RCS_METRICS_NAMESPACE, Value: !Sub 'RCS/${AWS::StackName}' }
            - { Name: GOMEMLIMIT, Value: !FindInMap [TaskSize, !Ref HssTaskSize, GoMemLimit] }
            - { Name: HSS_STORE, Value: dynamodb }
            - { Name: HSS_SUBSCRIBERS_TABLE, Value: !Ref SubscribersTable }
            - { Name: HSS_PROFILES_TABLE, Value: !Ref ServiceProfilesTable }
            - { Name: HSS_KMS_KEY_ID, Value: !GetAtt HssKey.Arn }
            - { Name: HSS_FT_REALM, Value: !Ref FtRealm }
            # Only the private subnets hold CSCF tasks (ADR 0007 §6).
            - Name: HSS_DIAMETER_PEER_NETWORKS
              Value: !Join [',', [!Select [2, !Cidr [!Ref VpcCidr, 4, 12]], !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]]]
            - { Name: HSS_SCSCF_NAMES, Value: !Sub 'sip:scscf.${ServiceNamespace}' }
            - { Name: HSS_KEYRING_BOOTSTRAP, Value: !Ref HssKeyringBootstrap }
            - { Name: HSS_START_TIMEOUT, Value: 60s }
          Secrets:
            - { Name: RCS_PII_HMAC_KEY, ValueFrom: !Ref PiiHmacKey }
            - { Name: HSS_ADMIN_TOKEN, ValueFrom: !Ref HssAdminToken }
            - { Name: HSS_ADMIN_TOKEN_NEXT, ValueFrom: !Ref HssAdminTokenNext }
            - { Name: HSS_ACS_TOKEN, ValueFrom: !Ref AcsHssToken }
            - { Name: HSS_ACS_TOKEN_NEXT, ValueFrom: !Ref AcsHssTokenNext }
            - { Name: HSS_FT_TOKEN, ValueFrom: !Ref FtHssToken }
            - { Name: HSS_FT_TOKEN_NEXT, ValueFrom: !Ref FtHssTokenNext }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref HssLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: hss

  FtServerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-ft-server'
      Cpu: !FindInMap [TaskSize, !Ref FtServerTaskSize, Cpu]
      Memory: !FindInMap [TaskSize, !Ref FtServerTaskSize, Memory]
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt FtServerExecutionRole.Arn
      TaskRoleArn: !GetAtt FtServerTaskRole.Arn
      ContainerDefinitions:
        - Name: ft-server
          Image: !Sub
            - '${Repository}@${ImageDigest}'
            - Repository: { 'Fn::ImportValue': !Sub '${EcrStackName}-PlatformRepositoryUri' }
          Command: [ft-server]
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          StopTimeout: 120
          PortMappings:
            - { ContainerPort: 8081, Protocol: tcp }
            - { ContainerPort: 8080, Protocol: tcp }
          HealthCheck: { Command: [CMD, ft-server, -healthcheck], Interval: 15, Timeout: 5, Retries: 3, StartPeriod: 30 }
          Environment:
            - { Name: RCS_ENV, Value: !Ref Environment }
            - { Name: RCS_SERVICE_NAMESPACE, Value: !Ref ServiceNamespace }
            - { Name: RCS_METRICS_NAMESPACE, Value: !Sub 'RCS/${AWS::StackName}' }
            # The ALB has already drained the task (FtDeregistrationDelay)
            # before SIGTERM; uploads still running get FT_DRAIN_TIMEOUT, and
            # their leases are released within the stop timeout.
            - { Name: RCS_SHUTDOWN_TIMEOUT, Value: 115s }
            - { Name: FT_DRAIN_TIMEOUT, Value: 100s }
            - { Name: GOMEMLIMIT, Value: !FindInMap [TaskSize, !Ref FtServerTaskSize, GoMemLimit] }
            - { Name: FT_LISTEN_ADDR, Value: ':8081' }
            - Name: FT_UPLOAD_URI
              Value: !Join ['', [!If [HasAlbCertificate, 'https://', 'http://'], !If [HasFtHostName, !Ref FtHostName, !GetAtt Alb.DNSName], /ft]]
            - Name: FT_DOWNLOAD_URI
              Value: !Join ['', [!If [HasAlbCertificate, 'https://', 'http://'], !If [HasFtHostName, !Ref FtHostName, !GetAtt Alb.DNSName], /dl]]
            - { Name: FT_REALM, Value: !Ref FtRealm }
            - { Name: FT_CREDENTIALS, Value: hss }
            # Plain http inside the VPC to a Cloud Map name, with the service
            # token (ADR 0007 §5).
            - { Name: FT_HSS_URL, Value: !Sub 'http://hss.${ServiceNamespace}:8081' }
            - { Name: FT_STORE, Value: aws }
            - { Name: FT_S3_BUCKET, Value: !Ref FilesBucket }
            - { Name: FT_SSE, Value: !Ref FileEncryption }
            - { Name: FT_DYNAMODB_TABLE, Value: !Ref FilesTable }
            - { Name: FT_VALIDITY, Value: !FindInMap [FtValidity, !Ref FtValidityDays, Duration] }
          Secrets:
            - { Name: RCS_PII_HMAC_KEY, ValueFrom: !Ref PiiHmacKey }
            - { Name: FT_HSS_TOKEN, ValueFrom: !Ref FtHssToken }
            - { Name: FT_NONCE_KEY, ValueFrom: !Ref FtNonceKey }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FtServerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ft-server

  RelayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-msrp-relay'
      Cpu: !FindInMap [TaskSize, !Ref RelayTaskSize, Cpu]
      Memory: !FindInMap [TaskSize, !Ref RelayTaskSize, Memory]
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt RelayExecutionRole.Arn
      TaskRoleArn: !GetAtt MsrpRelayTaskRole.Arn
      ContainerDefinitions:
        - Name: msrp-relay
          Image: !Sub
            - '${Repository}@${ImageDigest}'
            - Repository: { 'Fn::ImportValue': !Sub '${EcrStackName}-PlatformRepositoryUri' }
          Command: [msrp-relay]
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          StopTimeout: 120
          # Connections are file descriptors: room for RelayMaxConnections,
          # the core side and the store.
          Ulimits: [{ Name: nofile, SoftLimit: 131072, HardLimit: 131072 }]
          PortMappings:
            - { ContainerPort: 2855, Protocol: tcp }
            - { ContainerPort: 8082, Protocol: tcp }
          HealthCheck: { Command: [CMD, msrp-relay, -healthcheck], Interval: 15, Timeout: 5, Retries: 3, StartPeriod: 30 }
          Environment:
            - { Name: RCS_ENV, Value: !Ref Environment }
            - { Name: RCS_SERVICE_NAMESPACE, Value: !Ref ServiceNamespace }
            - { Name: RCS_METRICS_NAMESPACE, Value: !Sub 'RCS/${AWS::StackName}' }
            - { Name: RCS_PROXY_PROTOCOL, Value: 'true' }
            # #54: most of the 120 s stop timeout, so clients are not all cut
            # at once on a rolling update (docs/msrp-relay.md, Settings).
            - { Name: RCS_SHUTDOWN_TIMEOUT, Value: 115s }
            - { Name: RELAY_DRAIN_TIMEOUT, Value: 100s }
            - { Name: GOMEMLIMIT, Value: !FindInMap [TaskSize, !Ref RelayTaskSize, GoMemLimit] }
            - { Name: RELAY_PUBLIC_HOST, Value: !If [HasRelayPublicHost, !Ref RelayPublicHost, !GetAtt Nlb.DNSName] }
            # msrps on the NLB's TLS listener; plain msrp on 2855 only in a dev
            # stack without a certificate, which the relay refuses outside dev.
            - { Name: RELAY_PUBLIC_PORT, Value: !If [HasNlbCertificate, '2856', '2855'] }
            - { Name: RELAY_PUBLIC_TLS, Value: !If [HasNlbCertificate, 'true', 'false'] }
            - { Name: RELAY_CORE_PORTS, Value: '2855' }
            - { Name: RELAY_DYNAMODB_TABLE, Value: !Ref MsrpBindingsTable }
            - { Name: RELAY_MAX_CONNECTIONS, Value: !Ref RelayMaxConnections }
          Secrets:
            - { Name: RCS_PII_HMAC_KEY, ValueFrom: !Ref PiiHmacKey }
            - { Name: RELAY_PCSCF_TOKEN, ValueFrom: !Ref PcscfRelayToken }
            - { Name: RELAY_PCSCF_TOKEN_NEXT, ValueFrom: !Ref PcscfRelayTokenNext }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RelayLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: msrp-relay

  # acs is a Python service from its own repository (ADR 0006), configured as
  # in that repository's infra/app.yaml. It has no -healthcheck mode; the ALB
  # checks it.
  AcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-acs'
      Cpu: !FindInMap [TaskSize, !Ref AcsTaskSize, Cpu]
      Memory: !FindInMap [TaskSize, !Ref AcsTaskSize, Memory]
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt AcsExecutionRole.Arn
      TaskRoleArn: !GetAtt AcsTaskRole.Arn
      ContainerDefinitions:
        - Name: acs
          Image: !Sub
            - '${Repository}@${AcsImageDigest}'
            - Repository: { 'Fn::ImportValue': !Sub '${EcrStackName}-AcsRepositoryUri' }
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          StopTimeout: 30
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - { Name: ACS_ENV, Value: !Ref Environment }
            - { Name: ACS_AWS_REGION, Value: !Ref AWS::Region }
            - { Name: ACS_STORE_BACKEND, Value: dynamodb }
            - { Name: ACS_TABLE_NAME, Value: !Ref AcsTable }
            - { Name: ACS_SMS_PROVIDER, Value: !Ref AcsSmsProvider }
            - { Name: ACS_SMS_ORIGINATION_IDENTITY, Value: !Ref AcsSmsOriginationIdentity }
            - { Name: ACS_DEFAULT_RCS_PROFILE, Value: !Ref AcsDefaultRcsProfile }
            # Empty, acs's default: header enrichment off. acs trusts an
            # identity header (X-3GPP-Intended-Identity) from clients whose
            # address, as the ALB saw it, is in these ranges: operator
            # gateways on the data path, not the ALB. No range of this VPC
            # (the ALB's subnets included) is ever such a client, so any
            # value here would only add a way to forge an identity later.
            - { Name: ACS_TRUSTED_PROXY_CIDRS, Value: '' }
            - { Name: ACS_DEV_ENDPOINTS_ENABLED, Value: 'false' }
            - { Name: ACS_METRICS_NAMESPACE, Value: !Sub 'RCS/${AWS::StackName}/acs' }
            - Name: ACS_DM_ACCOUNT_URI
              Value: !Join ['', [!If [HasAlbCertificate, 'https://', 'http://'], !If [HasAcsHostName, !Ref AcsHostName, !GetAtt Alb.DNSName], /dm]]
          Secrets:
            - { Name: ACS_ADMIN_TOKEN, ValueFrom: !Ref AcsAdminToken }
            - { Name: ACS_PII_HASH_SECRET, ValueFrom: !Ref AcsPiiHashSecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: acs

  # -------------------------------------------------------------- services
  #
  # Two tasks or more in prod (Rules), one task added and one retired per
  # rolling-update step (ADR 0003), a circuit breaker that rolls back a
  # deployment whose tasks do not become healthy, no ECS Exec (checked).

  # Tasks of a new stack reach their images, secrets and logs only through
  # the interface endpoints: every service waits for them and for both sides
  # of its group's path to them, its egress and the endpoints' ingress (ECS
  # starts tasks as soon as a service exists). make infra-lint checks that
  # every endpoint and endpoint rule is listed.
  EndpointsReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Endpoints: !If
        - WithInterfaceEndpoints
        - - !Ref S3Endpoint
          - !Ref DynamoDbEndpoint
          - !Ref LogsEndpoint
          - !Ref EcrApiEndpoint
          - !Ref EcrDkrEndpoint
          - !Ref SecretsManagerEndpoint
          - !Ref KmsEndpoint
          - !Ref ServiceDiscoveryEndpoint
          - !Ref DataServiceDiscoveryEndpoint
          - !If [WithEumEndpoint, !Ref SmsVoiceEndpoint, '']
          - !If [WithSnsEndpoint, !Ref SnsEndpoint, '']
          - !Ref PcscfToEndpoints
          - !Ref IcscfToEndpoints
          - !Ref ScscfToEndpoints
          - !Ref RcsAsToEndpoints
          - !Ref HssToEndpoints
          - !Ref MsrpRelayToEndpoints
          - !Ref FtServerToEndpoints
          - !Ref AcsToEndpoints
          - !Ref OperatorToEndpoints
          - !Ref PcscfToEndpointsOut
          - !Ref IcscfToEndpointsOut
          - !Ref ScscfToEndpointsOut
          - !Ref RcsAsToEndpointsOut
          - !Ref HssToEndpointsOut
          - !Ref MsrpRelayToEndpointsOut
          - !Ref FtServerToEndpointsOut
          - !Ref AcsToEndpointsOut
          - !Ref OperatorToEndpointsOut
        - [!Ref S3Endpoint, !Ref DynamoDbEndpoint]

  HssService:
    Type: AWS::ECS::Service
    DependsOn: EndpointsReady
    Properties:
      ServiceName: hss
      Cluster: !Ref Cluster
      TaskDefinition: !Ref HssTaskDefinition
      DesiredCount: !Ref HssDesiredCount
      CapacityProviderStrategy: [{ CapacityProvider: FARGATE, Weight: 1 }]
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: !FindInMap [RollingUpdate, !Ref HssDesiredCount, MaximumPercent]
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref HssSecurityGroup]
          AssignPublicIp: DISABLED
      ServiceRegistries: [{ RegistryArn: !GetAtt HssDiscovery.Arn }]

  FtServerService:
    Type: AWS::ECS::Service
    DependsOn: [FtServerRule, EndpointsReady]
    Properties:
      ServiceName: ft-server
      Cluster: !Ref Cluster
      TaskDefinition: !Ref FtServerTaskDefinition
      DesiredCount: !Ref FtServerDesiredCount
      CapacityProviderStrategy: [{ CapacityProvider: FARGATE, Weight: 1 }]
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: !FindInMap [RollingUpdate, !Ref FtServerDesiredCount, MaximumPercent]
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref FtServerSecurityGroup]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ ContainerName: ft-server, ContainerPort: 8081, TargetGroupArn: !Ref FtServerTargetGroup }]
      ServiceRegistries: [{ RegistryArn: !GetAtt FtServerDiscovery.Arn }]

  # ECS needs the target group on a listener before the service starts. The
  # listener the relay hands out is the TLS one when there is a certificate,
  # and in a dev stack without one the plain one (the Rules require a
  # certificate outside dev); this handle depends on whichever applies.
  RelayListenerReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Listener: !If [HasNlbCertificate, !Ref MsrpTlsListener, !Ref MsrpTcpListener]

  RelayService:
    Type: AWS::ECS::Service
    DependsOn: [RelayListenerReady, EndpointsReady]
    Properties:
      ServiceName: msrp-relay
      Cluster: !Ref Cluster
      TaskDefinition: !Ref RelayTaskDefinition
      DesiredCount: !Ref RelayDesiredCount
      CapacityProviderStrategy: [{ CapacityProvider: FARGATE, Weight: 1 }]
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: !FindInMap [RollingUpdate, !Ref RelayDesiredCount, MaximumPercent]
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref MsrpRelaySecurityGroup]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ ContainerName: msrp-relay, ContainerPort: 2855, TargetGroupArn: !Ref RelayMsrpTargetGroup }]
      ServiceRegistries: [{ RegistryArn: !GetAtt RelayDiscovery.Arn }]

  AcsService:
    Type: AWS::ECS::Service
    DependsOn: [FtServerRule, EndpointsReady]
    Properties:
      ServiceName: acs
      Cluster: !Ref Cluster
      TaskDefinition: !Ref AcsTaskDefinition
      DesiredCount: !Ref AcsDesiredCount
      CapacityProviderStrategy: [{ CapacityProvider: FARGATE, Weight: 1 }]
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: !FindInMap [RollingUpdate, !Ref AcsDesiredCount, MaximumPercent]
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref AcsSecurityGroup]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ ContainerName: acs, ContainerPort: 8080, TargetGroupArn: !Ref AcsTargetGroup }]
      ServiceRegistries: [{ RegistryArn: !GetAtt AcsDiscovery.Arn }]

  # ---------------------------------------------------------------- alarms
  #
  # From each service's alarm list (docs/ft-server.md, docs/msrp-relay.md,
  # docs/hss.md) and the load balancers and tables. Every alarm has a
  # section of the same name in docs/runbook.md. Service metrics are EMF in
  # the RCS/<stack> namespace with the Service dimension only.

  # Encrypts the alarm topic. CloudWatch, EventBridge and AWS Budgets cannot
  # use the AWS managed aws/sns key, so the topic has its own, which only they
  # may use, and only for this account.
  AlarmKey:
    Type: AWS::KMS::Key
    Condition: CreateAlarmTopic
    Properties:
      Description: !Sub 'Encrypts the alarm topic of ${AWS::StackName}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AdministerWithoutUsing
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:CreateAlias
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: PublishersEncrypt
            Effect: Allow
            Principal: { Service: [cloudwatch.amazonaws.com, events.amazonaws.com, budgets.amazonaws.com] }
            Action: ['kms:GenerateDataKey*', kms:Decrypt]
            Resource: '*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }

  # One dashboard per stack: the golden signals of each service (traffic,
  # errors, latency, saturation) beside the load balancers and tables, so the
  # runbook's checks start from one page (operations review). Three are free
  # per account, then $3 a month each.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}'
      DashboardBody: !Sub '{"widgets":[{"type":"metric","x":0,"y":0,"width":8,"height":6,"properties":{"title":"ALB requests and 5xx","region":"${AWS::Region}","stat":"Sum","period":60,"view":"timeSeries","metrics":[["AWS/ApplicationELB","RequestCount","LoadBalancer","${Alb.LoadBalancerFullName}"],[".","HTTPCode_ELB_5XX_Count",".","."],[".","HTTPCode_Target_5XX_Count",".","."]]}},{"type":"metric","x":8,"y":0,"width":8,"height":6,"properties":{"title":"ALB target response time (p99)","region":"${AWS::Region}","stat":"p99","period":60,"view":"timeSeries","metrics":[["AWS/ApplicationELB","TargetResponseTime","TargetGroup","${AcsTargetGroup.TargetGroupFullName}","LoadBalancer","${Alb.LoadBalancerFullName}"],["...","${FtServerTargetGroup.TargetGroupFullName}",".","."]]}},{"type":"metric","x":16,"y":0,"width":8,"height":6,"properties":{"title":"Healthy targets","region":"${AWS::Region}","stat":"Minimum","period":60,"view":"timeSeries","metrics":[["AWS/ApplicationELB","HealthyHostCount","TargetGroup","${AcsTargetGroup.TargetGroupFullName}","LoadBalancer","${Alb.LoadBalancerFullName}"],["...","${FtServerTargetGroup.TargetGroupFullName}",".","."],["AWS/NetworkELB","HealthyHostCount","TargetGroup","${RelayMsrpTargetGroup.TargetGroupFullName}","LoadBalancer","${Nlb.LoadBalancerFullName}"]]}},{"type":"metric","x":0,"y":6,"width":8,"height":6,"properties":{"title":"ECS CPU (%)","region":"${AWS::Region}","stat":"Maximum","period":60,"view":"timeSeries","metrics":[["AWS/ECS","CPUUtilization","ClusterName","${Cluster}","ServiceName","hss"],["AWS/ECS","CPUUtilization","ClusterName","${Cluster}","ServiceName","ft-server"],["AWS/ECS","CPUUtilization","ClusterName","${Cluster}","ServiceName","msrp-relay"],["AWS/ECS","CPUUtilization","ClusterName","${Cluster}","ServiceName","acs"]]}},{"type":"metric","x":8,"y":6,"width":8,"height":6,"properties":{"title":"ECS memory (%)","region":"${AWS::Region}","stat":"Maximum","period":60,"view":"timeSeries","metrics":[["AWS/ECS","MemoryUtilization",
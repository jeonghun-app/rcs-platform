      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 2000
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      TreatMissingData: missing
      Metrics:
        - Id: mar
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Sub 'RCS/${AWS::StackName}'
              MetricName: cx.mar
              Dimensions: [{ Name: Service, Value: hss }]

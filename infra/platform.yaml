      OKActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Namespace: !Sub 'RCS/${AWS::StackName}'
      MetricName: ServerTransactionsRejected
      Dimensions: [{ Name: Service, Value: pcscf }]
      Statistic: Sum
      Period: 60
  IcscfTransactionsRejected:

  # The ALB answering by itself: 502/503/504 when no target can take the
  # request, which no target metric shows.
  AlbElb5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-AlbElb5xx'
      AlarmDescription: 'Over 5% of ALB requests are answered 5xx by the ALB itself. See docs/runbook.md#albelb5xx.'
      AlarmActions: [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]

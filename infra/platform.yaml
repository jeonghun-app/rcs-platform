  HssCxLatency:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-HssCxLatency'
      AlarmDescription: 'MAR or SAR took over 2 s, near the 3 s HSS_CX_TIMEOUT. See docs/runbook.md#hsscxlatency.'

# Every job runs the same Make targets a contributor runs locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; a main run is never cancelled
  # once started (a queued one can still be replaced by a newer merge).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fmt, vet, test, race, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make race
      - run: make checkptr
      - run: make build

  fuzz:
    name: fuzz every parser briefly
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make fuzz FUZZTIME=5s
      # A crashing input is written under testdata/fuzz/ and is the only way to
      # reproduce the failure, so keep it.
      - name: keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # Builds deploy/Dockerfile so a base image digest update (Dependabot) cannot
  # merge green and fail only at deploy time, and checks the properties the
  # deployment relies on: a non-root numeric user and a stamped binary that runs.
  image:
    name: image builds and runs as non-root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image VERSION=ci
      - name: image runs as uid 65532 and reports its version
        run: |
          user="$(docker image inspect rcs-platform:ci --format '{{.Config.User}}')"
          if [ "$user" != "65532:65532" ]; then
            echo "image user is '$user', want 65532:65532" >&2; exit 1
          fi
          out="$(docker run --rm rcs-platform:ci)"
          if [ "$out" != "rcs-version ci" ]; then
            echo "rcs-version printed '$out', want 'rcs-version ci'" >&2; exit 1
          fi

  # The ft-server and HSS storage backends against digest-pinned local
  # containers (make test-integration). A job of its own, outside `make
  # check`, because it starts two JVM containers; its name is stable so it
  # can be made a required check.
  integration:
    name: storage integration (S3, DynamoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-integration

  # rcs-sim against the built ft-server and msrp-relay binaries (make e2e):
  # file transfer with resume, chat through the relay in both connection
  # orders, IMDN. Outside `make check` because it builds and runs three
  # binaries; its name is stable so it can be made a required check.
  e2e:
    name: end to end (rcs-sim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make e2e

  # The whole platform with docker compose (make up): the platform image on
  # DynamoDB Local and S3Mock, and the pinned acs release; then rcs-sim and
  # the acs checks against it (make e2e-compose). The stack is removed
  # however the job ends. Its name is stable so it can be made a required
  # check.
  compose:
    name: end to end (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make up
      - run: make e2e-compose
      - name: stack logs
        if: failure()
        run: make logs LOGS="--no-color --tail=500"
      - name: remove the stack
        if: always()
        run: make down

  # CloudFormation templates: cfn-lint, and the policy checks of
  # scripts/check_infra.py (ADR 0007 security group matrix, Proxy Protocol v2,
  # locked-down tasks, PITR, no secrets for task roles). No AWS access.
  infra:
    name: infrastructure templates and policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make infra-lint

  vuln:
    name: modules and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make vuln

  hygiene:
    name: workflows, docs links, privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-actions
      - run: make docs
      - run: make privacy
      - name: no credentials or env files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "an env file is tracked" >&2; exit 1
          fi
          if git grep -nIE 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- ':!*_test.go'; then
            echo "a credential is tracked" >&2; exit 1
          fi

name: Feature request
description: A capability the platform should have.
labels: ["type/feature", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Behaviour you want. Cite specification clauses where they apply; do not paste their text.
    validations:
      required: true
